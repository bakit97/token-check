<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проверка токенов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Тёмный торговый терминал: плотные строки, моно-цифры, зелёный/красный только для смысла */
:root{
  --bg:#0a0c10;--panel:#11151b;--panel2:#161b23;--line:#222a35;--fg:#e6e9ee;--mut:#7d8796;
  --acc:#5b8cff;--up:#22d17b;--dn:#ff4d5e;--warn:#f5c04a;--new:#22d17b;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.35 var(--sans);-webkit-tap-highlight-color:transparent;
  padding-bottom:max(24px,env(safe-area-inset-bottom))}
.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.warn{color:var(--warn)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:max(8px,env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.brand{font-weight:800;letter-spacing:.02em;font-size:16px}
.live{font:700 11px var(--mono);color:var(--up);display:flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.6s infinite}
.live.off{color:var(--dn)}.live.off i{background:var(--dn);animation:none}
@keyframes pulse{50%{opacity:.25}}
.store{font:11px var(--mono);color:var(--mut);margin-left:auto}
.store.bad{color:var(--dn)}
.gear{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:17px}
.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
.tab{flex:1 1 auto;min-width:0;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab b{font-family:var(--mono);font-weight:700;opacity:.8;margin-left:3px}
.stat{font:11px var(--mono);color:var(--mut);padding:8px 0 2px;display:flex;gap:10px;flex-wrap:wrap}

/* rows */
.list{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 64px auto;gap:8px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;position:relative;overflow:hidden}
.row:active{background:var(--panel2)}
.row.enter{animation:enter .6s cubic-bezier(.2,.8,.2,1)}
.row.enter::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--new);animation:glow 8s forwards;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes glow{0%,60%{opacity:1}100%{opacity:0}}
.row.fl-up{animation:flu .7s}.row.fl-dn{animation:fld .7s}
@keyframes flu{0%{background:rgba(34,209,123,.22)}100%{background:var(--panel)}}
@keyframes fld{0%{background:rgba(255,77,94,.22)}100%{background:var(--panel)}}
.row.inwin{border-color:rgba(34,209,123,.55)}
.av{width:34px;height:34px;border-radius:50%;background:var(--panel2);object-fit:cover;display:block}
.av.ph{display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);color:var(--mut)}
.mid{min-width:0}
.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nm span{color:var(--mut);font-weight:600;font-size:12px;margin-left:4px}
.l2,.l3{font:11px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 .age{color:var(--fg);font-weight:700}
.l2 .age.fresh{color:var(--up)}
.l2 .tok{color:var(--dn)}
.spark{width:64px;height:28px;display:block}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.px{font:700 12px var(--mono)}
.badge{font:700 10px var(--mono);padding:3px 6px;border-radius:6px;white-space:nowrap}
.b-pass{background:rgba(34,209,123,.15);color:var(--up)}
.b-fail{background:rgba(255,77,94,.14);color:var(--dn)}
.b-wait{background:rgba(91,140,255,.15);color:var(--acc)}
.b-late{background:rgba(245,192,74,.14);color:var(--warn)}
.b-miss{background:var(--panel2);color:var(--mut)}
.empty{padding:28px 10px;text-align:center;color:var(--mut);font-size:13px;line-height:1.5}
.sec-h{font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-in{position:relative;width:100%;max-height:92vh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:6px max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.dh{display:flex;gap:10px;align-items:center;padding-right:40px}
.dh .av{width:44px;height:44px}
.addr{font:11px var(--mono);color:var(--mut);word-break:break-all}
.copy{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;font-size:11px;margin-top:4px}
.chart{width:100%;height:340px;border:0;border-radius:12px;background:#0f1218;margin-top:10px;display:block}
.seg{display:flex;gap:4px;margin-top:8px}
.seg button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:12px;font-weight:700}
.seg button.on{color:var(--fg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}
.cell small{display:block;font:10px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.cell b{font:700 13px var(--mono)}
.verdict{margin-top:10px;padding:12px;border-radius:12px;font-weight:800;font-size:15px}
.v-pass{background:rgba(34,209,123,.12);color:var(--up);border:1px solid rgba(34,209,123,.4)}
.v-fail{background:rgba(255,77,94,.11);color:var(--dn);border:1px solid rgba(255,77,94,.4)}
.v-wait{background:rgba(91,140,255,.1);color:var(--acc);border:1px solid rgba(91,140,255,.4)}
.v-late{background:rgba(245,192,74,.1);color:var(--warn);border:1px solid rgba(245,192,74,.4)}
.v-miss{background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.verdict small{display:block;font-weight:600;font-size:12px;opacity:.85;margin-top:2px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:8px}
.grp h4{margin:8px 0 2px;font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ck{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.grp h4+.ck{border-top:0}
.ck i{font-style:normal;width:18px;flex:none;text-align:center;font-weight:800}
.ck .ok{color:var(--up)}.ck .no{color:var(--dn)}.ck .wt{color:var(--acc)}.ck .off{color:var(--mut)}.ck .er{color:var(--warn)}
.ck span{display:block;color:var(--mut);font-size:12px}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.links a{padding:10px 4px;text-align:center;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12px;font-weight:700}
.links a.buy{background:var(--up);color:#04140b;border-color:var(--up)}

/* check tab */
.inrow{display:flex;gap:6px;margin-top:10px}
.inrow input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:13px var(--mono)}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:800}

/* settings */
.set h3{margin:14px 0 4px;font-size:15px}
.set .hint{color:var(--mut);font-size:12px;margin:0 0 6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.opt label{font-weight:700;font-size:13px}
.opt p{grid-column:1/-1;margin:0;color:var(--mut);font-size:12px}
.opt input[type=number]{width:84px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:13px var(--mono);text-align:right}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--up)}
.rowopt{display:flex;gap:6px;align-items:center}

/* history */
.agg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.agg h3{margin:0 0 4px;font-size:14px}
.tbl{overflow-x:auto;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;font:12px var(--mono)}
.tbl th,.tbl td{padding:5px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-weight:500}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px}
.hcard .hh{display:flex;gap:8px;align-items:center}
.hcard .av{width:26px;height:26px}
.hcard svg{width:100%;height:90px;display:block;margin-top:4px}
.big svg{height:220px}

/* фильтры и правила */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:700;font-size:12px}
.chip.on{background:rgba(34,209,123,.14);border-color:rgba(34,209,123,.55);color:var(--up)}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.rule.off{opacity:.55}
.rule .rh{display:flex;align-items:center;gap:8px}
.rule .rh h3{margin:0;font-size:15px;flex:1}
.tg{width:44px;height:26px;border-radius:13px;background:var(--up);position:relative;flex:none;border:0}
.tg::after{content:'';position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.off{background:var(--line)}.tg.off::after{right:21px}
.rule p{margin:6px 0 0;font-size:13px;line-height:1.45}
.rule p em{font-style:normal;color:var(--up);font-family:var(--mono);font-weight:700}
.rule .why{color:var(--mut);font-size:12px;margin-top:4px}
.slw{margin-top:10px}
.slw .sll{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mut)}
.slw .sll b{color:var(--fg)}
.slw input[type=range]{width:100%;accent-color:var(--up);margin:6px 0 0;height:26px}
.rcnt{margin-top:6px;font:11px var(--mono);color:var(--mut)}.rcnt b{color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}
.sum b{display:block;font:700 16px var(--mono)}.sum small{font:10px var(--mono);color:var(--mut)}
/* сделки */
.trs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.trs h4{margin:0;font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.tseg{display:flex;gap:4px;margin-top:8px}
.tseg button{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:12px;font-weight:700}
.tseg button.on{color:var(--fg);border-color:var(--acc)}
.trsum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.trsum div{border-radius:9px;padding:8px;text-align:center;border:1px solid}
.trsum .b{background:rgba(34,209,123,.08);border-color:rgba(34,209,123,.35);color:var(--up)}
.trsum .s{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:var(--dn)}
.trsum b{display:block;font:700 16px var(--mono)}.trsum small{font:11px var(--mono);opacity:.85}
.trbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.trbar i{display:block;background:var(--up)}.trbar u{display:block;background:var(--dn);flex:1}
.trmeta{font:11px var(--mono);color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.trl{max-height:380px;overflow-y:auto;margin-top:6px}
.tr{display:grid;grid-template-columns:42px 16px minmax(0,1fr) auto 64px;gap:6px;align-items:center;padding:6px 2px;border-top:1px solid var(--line);font:12px var(--mono)}
.tr .tt{color:var(--mut)}.tr .tu{font-weight:700}.tr .tp{color:var(--mut);text-align:right}
.tr.buy .tk,.tr.buy .tu{color:var(--up)}.tr.sell .tk,.tr.sell .tu{color:var(--dn)}
.tr.big .tu{font-size:13px}.tr.big{background:rgba(245,192,74,.06)}
.tr .tw{color:var(--mut);text-decoration:none;text-align:right;overflow:hidden;text-overflow:ellipsis}
.tr.enter{animation:trin 1.6s ease-out}@keyframes trin{0%{background:rgba(91,140,255,.35)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand">SOL·СКАН</div>
    <div class="live" id="live"><i></i><span>LIVE</span></div>
    <div class="store" id="store">память…</div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-t="all">Все<b id="nAll">0</b></button>
    <button class="tab" data-t="pass">Прошли<b id="nPass">0</b></button>
    <button class="tab" data-t="hist">История</button>
    <button class="tab" data-t="rules">Правила</button>
    <button class="tab" data-t="check">Проверка</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-all">
    <div class="chips"><button class="chip" id="fFresh"></button><button class="chip" id="fScam">🚫 Без скама</button><button class="chip" id="fLiq"></button></div>
    <div class="stat" id="statAll"></div>
    <div class="list" id="lAll"><div class="empty">Загружаю новые пары…</div></div>
  </section>
  <section id="v-pass" hidden>
    <div class="stat" id="statPass"></div>
    <div class="list" id="lPass"></div>
  </section>
  <section id="v-hist" hidden>
    <div id="hist"></div>
  </section>
  <section id="v-rules" hidden><div class="stat"><span id="rulesHead"></span></div><div id="rules"></div></section>
  <section id="v-check" hidden>
    <div class="inrow"><input id="addr" placeholder="Адрес контракта" autocomplete="off" spellcheck="false"><button class="btn" id="go">Проверить</button></div>
    <div id="out"><p class="mut" style="margin-top:10px">Вставь адрес любой монеты Solana — проверю по тем же правилам, что и ленту.</p></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-in"><div class="grab"></div><button class="x" data-close aria-label="Закрыть">✕</button><div id="sheetBody"></div></div></div>

<script>
'use strict';
/* =================== утилиты =================== */
const DS='https://api.dexscreener.com', GT='https://api.geckoterminal.com/api/v2/networks/solana', RC='https://api.rugcheck.xyz/v1';
const RPCS=['https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUB='₀₁₂₃₄₅₆₇₈₉';
function price(p){if(p==null||!isFinite(p)||p<=0)return '—';if(p>=1)return '$'+p.toFixed(3);
  const s=p.toFixed(20).split('.')[1];const z=s.match(/^0*/)[0].length;
  if(z<3)return '$'+p.toFixed(z+4);return '$0.0'+String(z).split('').map(d=>SUB[d]).join('')+s.slice(z,z+4)}
const money=n=>n==null||!isFinite(n)?'—':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+Math.round(n);
const pct=n=>n==null||!isFinite(n)?'—':(n>0?'+':'')+(Math.abs(n)>=100?Math.round(n):Math.round(n*10)/10)+'%';
const f1=n=>n==null||!isFinite(n)?'—':(Math.round(n*10)/10).toString();
const xf=n=>n==null||!isFinite(n)?'—':'×'+(n>=10?n.toFixed(1):n.toFixed(2));
function ago(ms){if(!ms)return '—';let s=Math.max(0,Math.floor((Date.now()-ms)/1000));
  if(s<60)return s+'с';const m=Math.floor(s/60);if(m<60)return m+':'+String(s%60).padStart(2,'0');
  const h=Math.floor(m/60);if(h<24)return h+'ч '+(m%60)+'м';return Math.floor(h/24)+'д'}
const dur=min=>min==null||!isFinite(min)?'—':min<60?Math.max(0,Math.round(min))+'м':(Math.floor(min/60)+'ч'+(Math.round(min%60)?(' '+Math.round(min%60)+'м'):''));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SKIPTOK=new Set(['So11111111111111111111111111111111111111112','EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v','Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB']);
const isCurve=d=>/pump-?fun/i.test(d||'')&&!/swap/i.test(d||'');
const isPumpSwap=d=>/pump-?swap/i.test(d||'');
// владельцы, которые являются пулами/сжиганием, а не людьми
const SYS='11111111111111111111111111111111';
const POOL_AUTH=new Set(['5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1','GpMZbSM2GgvTKHJirzeGfMFoaZ8UR2X7F4v8vHTvxFbL','HLnpSz9h2S4hiLQ43rnSD9XkcUThA7B8hQMKmDaiTLcC','FhVo3mqL8PW5pH5U2CN4XE33DokiyZnUwuGpH2hmHLuM','1nc1nerator11111111111111111111111111111111','11111111111111111111111111111111']);
const T22='TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb';
const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;

/* base58 + ed25519 on-curve + findProgramAddress — для проверки кривой pump.fun */
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function b58dec(s){let n=0n;for(const ch of s){const i=B58.indexOf(ch);if(i<0)throw new Error('base58');n=n*58n+BigInt(i)}
  const out=[];while(n>0n){out.push(Number(n&255n));n>>=8n}for(const ch of s){if(ch==='1')out.push(0);else break}return new Uint8Array(out.reverse())}
function b58enc(b){let n=0n;for(const x of b)n=(n<<8n)+BigInt(x);let s='';while(n>0n){s=B58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
const EP=(1n<<255n)-19n;
const emod=a=>((a%EP)+EP)%EP;
function epow(b,e){let r=1n;b=emod(b);while(e>0n){if(e&1n)r=r*b%EP;b=b*b%EP;e>>=1n}return r}
const ED=emod(-121665n*epow(121666n,EP-2n));
const ESQ=epow(2n,(EP-1n)/4n);
function onCurve(bytes){let y=0n;for(let i=31;i>=0;i--)y=(y<<8n)+BigInt(bytes[i]);y&=(1n<<255n)-1n;if(y>=EP)return false;
  const y2=y*y%EP,u=emod(y2-1n),v=emod(ED*y2+1n);
  const v3=v*v%EP*v%EP,v7=v3*v3%EP*v%EP;let x=u*v3%EP*epow(u*v7%EP,(EP-5n)/8n)%EP;
  const vx2=v*x%EP*x%EP;if(vx2===u)return true;if(vx2===emod(-u))return true;return false}
async function sha256(b){return new Uint8Array(await crypto.subtle.digest('SHA-256',b))}
async function findPDA(seeds,prog){const pb=b58dec(prog);
  for(let bump=255;bump>=0;bump--){const parts=[...seeds,new Uint8Array([bump]),pb,new TextEncoder().encode('ProgramDerivedAddress')];
    const len=parts.reduce((s,p)=>s+p.length,0),buf=new Uint8Array(len);let o=0;parts.forEach(p=>{buf.set(p,o);o+=p.length});
    const h=await sha256(buf);if(!onCurve(h))return b58enc(h)}throw new Error('no PDA')}
const PUMP='6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P';
const bondingCurveOf=mint=>findPDA([new TextEncoder().encode('bonding-curve'),b58dec(mint)],PUMP);

async function j(url,opt){const r=await fetch(url,opt);if(r.status===429){const e=new Error('лимит');e.rl=1;throw e}
  if(!r.ok){const e=new Error('HTTP '+r.status);e.code=r.status;throw e}return r.json()}

const gtQ=[];let gtPause=0,gtErr='',gtOkAt=0;
function gt(path,prio=5){return new Promise((res,rej)=>{gtQ.push({path,prio,res,rej,t:Date.now()});gtQ.sort((a,b)=>a.prio-b.prio||a.t-b.t)})}
(async function gtLoop(){for(;;){
  if(gtQ.length&&Date.now()>gtPause){const t=gtQ.shift();
    try{t.res(await j(GT+t.path));gtErr='';gtOkAt=Date.now()}catch(e){if(e.rl)gtPause=Date.now()+30000;gtErr=e.rl?'лимит запросов, жду':e.message;t.rej(e)}}
  await sleep(6200)}})();
let rpcI=0,rpcErr='';
async function rpc(method,params){let last;const list=S.helius?['https://mainnet.helius-rpc.com/?api-key='+encodeURIComponent(S.helius.trim()),...RPCS]:RPCS;
  const start=S.helius?0:rpcI;for(let t=0;t<list.length;t++){const url=list[(start+t)%list.length];
    try{const body=JSON.stringify({jsonrpc:'2.0',id:1,method,params}),opt={method:'POST',headers:{'Content-Type':'application/json'},body};
      let d;try{d=await j(url,opt)}catch(e){if(!e.rl)throw e;await sleep(1200);d=await j(url,opt)}
      if(d.error)throw new Error(d.error.message||'ошибка RPC');if(!S.helius)rpcI=(start+t)%list.length;rpcErr='';return d.result}
    catch(e){last=e}}
  rpcErr=last?.message||'RPC';throw last}

function gtParse(d,inc){

  if(isCurve(dex))return null;
  let bid=d.relationships?.base_token?.data?.id||'',addr=bid.replace(/^solana_/,'');
  if(SKIPTOK.has(addr)){bid=d.relationships?.quote_token?.data?.id||'';addr=bid.replace(/^solana_/,'')}
  if(!addr||SKIPTOK.has(addr))return null;
  const tk=inc[bid]?.attributes||{};const t=a.transactions||{},v=a.volume_usd||{},pc=a.price_change_percentage||{};
  const listedAt=Date.parse(a.pool_created_at)||Date.now();
  const older1h=Date.now()-listedAt>3600e3;
  return{addr,name:tk.name||(a.name||'').split(' / ')[0],sym:tk.symbol||'',img:tk.image_url&&tk.image_url!=='missing.png'?tk.image_url:'',
    pair:a.address,dex,listedAt,
    price:+a.base_token_price_usd||0,liq:+a.reserve_in_usd||0,mc:+a.market_cap_usd||+a.fdv_usd||0,
    b24:t.h24?.buys||0,s24:t.h24?.sells||0,v24:+v.h24||0,ch5:+pc.m5||0,ch1:+pc.h1||0,
    b5:t.m5?.buys,s5:t.m5?.sells,v5:v.m5!=null?+v.m5:null,
    buyers:(older1h?t.h24?.buyers:t.h1?.buyers)??null}
}
function upsertGT(p){
  const c=C[p.addr];
  if(!c){if(Date.now()-p.listedAt>S.keepH*3600e3)return;
    const fresh=Date.now()-p.listedAt<=S.win*60e3;
    C[p.addr]={...p,spark:p.price?[[Date.now(),p.price]]:[],peak:p.price||0,status:fresh?'wait':'miss',isNew:booted,seenAt:Date.now(),
      firstPrice:Date.now()-p.listedAt<150e3?(p.price||null):null};
    if(fresh&&!C[p.addr].firstPrice)wantOhlcv(p.addr);return}
  if(p.listedAt<c.listedAt){c.listedAt=p.listedAt;c.pair=p.pair;c.dex=p.dex}
  if(p.buyers!=null)c.buyers=p.buyers;
  if(!c.dsAt){Object.assign(c,{price:p.price||c.price,liq:p.liq,mc:p.mc,b24:p.b24,s24:p.s24,v24:p.v24,ch5:p.ch5,ch1:p.ch1,b5:p.b5,s5:p.s5,v5:p.v5});pushSpark(c)}
  if(!c.img&&p.img)c.img=p.img;
}
function pushSpark(c){if(!c.price)return;c.peak=Math.max(c.peak||0,c.price);const s=c.spark||(c.spark=[]);const last=s[s.length-1];
  if(!last||Date.now()-last[0]>8000)s.push([Date.now(),c.price]);else last[1]=c.price;if(s.length>80)s.splice(0,s.length-80)}

async function pollDS(){
  const all=Object.values(C).sort((a,b)=>b.listedAt-a.listedAt);
  const hot=all.filter(c=>Date.now()-c.listedAt<S.win*60e3*2||c.status==='wait').slice(0,60);
  const rest=all.filter(c=>!hot.includes(c));const slice=rest.slice((dsTurn*30)%Math.max(rest.length,1)).slice(0,30);dsTurn++;
  const list=[...hot,...slice].map(c=>c.addr);
  for(let i=0;i<list.length;i+=30){try{applyDS(await j(`${DS}/tokens/v1/solana/${list.slice(i,i+30).join(',')}`))}catch{}}
  evalAll();render();

function applyDS(ps){
  const by={};ps.forEach(p=>{const a=p.baseToken?.address;if(!a||!C[a])return;(by[a]=by[a]||[]).push(p)});
  Object.entries(by).forEach(([a,arr])=>{const c=C[a];
    const cv=arr.filter(p=>isCurve(p.dexId)&&p.pairCreatedAt).map(p=>p.pairCreatedAt);if(cv.length)c.curveAt=Math.min(...cv);
    const created=Math.min(...arr.map(p=>p.pairCreatedAt||Infinity));if(isFinite(created)&&(!c.tokAt||created<c.tokAt))c.tokAt=created;
    const pools=arr.filter(p=>!isCurve(p.dexId));if(!pools.length)return;
    const p=pools.sort((x,y)=>(y.liquidity?.usd||0)-(x.liquidity?.usd||0))[0];const prev=c.price;
    Object.assign(c,{price:+p.priceUsd||c.price,liq:(p.liquidity?.usd>0?p.liquidity.usd:c.liq),mc:p.marketCap||p.fdv||c.mc,
      b24:p.txns?.h24?.buys??c.b24,s24:p.txns?.h24?.sells??c.s24,v24:p.volume?.h24??c.v24,
      ch5:p.priceChange?.m5??c.ch5,ch1:p.priceChange?.h1??c.ch1,b5:p.txns?.m5?.buys??c.b5,s5:p.txns?.m5?.sells??c.s5,v5:p.volume?.m5??c.v5,
      soc:(p.info?.socials||[]).length+(p.info?.websites||[]).length,dsAt:Date.now()});
    if(!c.img&&p.info?.imageUrl)c.img=p.info.imageUrl;if(!c.pair)c.pair=p.pairAddress;
    if(prev&&c.price&&prev!==c.price)c.flash=c.price>prev?'up':'dn';
    pushSpark(c)});
}

/* --- блокчейн (Solana RPC): mint, freeze, Token-2022, реальные владельцы --- */
async function rpcCheck(c){
  const mi=await rpc('getAccountInfo',[c.addr,{encoding:'jsonParsed'}]);
  const v=mi?.value;if(!v)throw new Error('токен не найден');
  const info=v.data?.parsed?.info||{};const is22=v.owner===T22;const bad=[];
  (info.extensions||[]).forEach(e=>{const s=e.state||{};
    if(e.extension==='transferFeeConfig'){const bps=Math.max(+(s.newerTransferFee?.transferFeeBasisPoints||0),+(s.olderTransferFee?.transferFeeBasisPoints||0));if(bps>0)bad.push('комиссия '+bps/100+'% на перевод')}
    if(e.extension==='transferHook'&&s.programId)bad.push('перехват переводов');
    if(e.extension==='permanentDelegate'&&s.delegate)bad.push('вечный делегат');
    if(e.extension==='nonTransferable')bad.push('нельзя переводить');
    if(e.extension==='defaultAccountState'&&/frozen/i.test(s.accountState||''))bad.push('счета заморожены');
    if(/pausable/i.test(e.extension))bad.push('можно поставить на паузу')});
  const dec=+info.decimals||0,supply=(+info.supply||0)/10**dec;
  const la=await rpc('getTokenLargestAccounts',[c.addr]);
  const accs=(la?.value||[]).filter(a=>+a.uiAmount>0);
  let owners=[];
  if(accs.length){const ma=await rpc('getMultipleAccounts',[accs.map(a=>a.address),{encoding:'jsonParsed'}]);
    const by={};accs.forEach((a,i)=>{const own=ma?.value?.[i]?.data?.parsed?.info?.owner||a.address;by[own]=(by[own]||0)+(+a.uiAmount)});
    // владелец-программа (пул, кривая pump.fun, хранилище) — не кит. Кит = обычный кошелёк (System Program)
    const ownList=Object.keys(by);let prog=new Set();
    try{const oa=await rpc('getMultipleAccounts',[ownList,{encoding:'base64',dataSlice:{offset:0,length:0}}]);
      ownList.forEach((o,i)=>{const v=oa?.value?.[i];if(v&&v.owner&&v.owner!==SYS)prog.add(o)})}catch{}
    const poolTok=c.liq&&c.price?c.liq/2/c.price:null;
    owners=Object.entries(by).filter(([o,amt])=>!(o===c.pair||POOL_AUTH.has(o)||prog.has(o)||(poolTok&&Math.abs(amt-poolTok)/poolTok<0.25)))
      .map(([o,amt])=>({o,p:supply?amt/supply*100:0})).sort((a,b)=>b.p-a.p)}
  // кривая pump.fun: есть и завершена → настоящая миграция, пул сожжён
  let bc=null;
  if(isPumpSwap(c.dex)){
    if(Math.abs(supply-1e9)>1||dec!==6)bc='none';
    else{let bca=null;try{bca=await bondingCurveOf(c.addr)}catch{}if(!bca)bc='none';else{const ai=await rpc('getAccountInfo',[bca,{encoding:'base64'}]);const v2=ai?.value;
      if(!v2||v2.owner!==PUMP)bc='none';else{const raw=atob(v2.data?.[0]||'');bc=raw.length>48&&raw.charCodeAt(48)===1?'complete':'open'}}}}
  c.rpc={at:Date.now(),is22,supply,dec,bc,mint:!!info.mintAuthority,freeze:!!info.freezeAuthority,bad,
    maxOwner:owners[0]?.p||0,maxOwnerAddr:owners[0]?.o||'',top10:owners.slice(0,10).reduce((s,x)=>s+x.p,0)};
  c.rpcErr='';
}
async function rpcLoop(){for(;;){
  const cand=Object.values(C).filter(c=>c.status==='wait'&&inWin(c)&&(!c.rpc||Date.now()-c.rpc.at>45000)&&(!c.rpcTry||Date.now()-c.rpcTry>15000))
    .sort((a,b)=>(!!a.rpc-!!b.rpc)||b.listedAt-a.listedAt);
  const c=cand[0];
  if(c){c.rpcTry=Date.now();try{await rpcCheck(c);c.rpcFails=0}catch(e){c.rpcErr=e.message||'ошибка';c.rpcFails=(c.rpcFails||0)+1}evalAll();render();await sleep(700)}
  else await sleep(1000)}}

function rcLite(r){
  const pools=new Set();(r.markets||[]).forEach(m=>[m.pubkey,m.liquidityAAccount,m.liquidityBAccount,m.lp?.lpMint].forEach(x=>x&&pools.add(x)));
  const hs=(r.topHolders||[]).filter(h=>!pools.has(h.address)&&!pools.has(h.owner));
  const sup=Number(r.token?.supply)||0;
  const rdec=+r.token?.decimals||0;
  return{has:!!r.token,supply:r.token?.supply!=null?(+r.token.supply)/10**rdec:null,dec:r.token?.decimals!=null?rdec:null,mint:!!r.token?.mintAuthority,freeze:!!r.token?.freezeAuthority,maxOwner:hs[0]?.pct||0,top10:hs.slice(0,10).reduce((s,h)=>s+(h.pct||0),0),
    risk22:(r.risks||[]).filter(x=>/transfer fee|permanent delegate|transfer hook|non.?transferable/i.test(x.name||'')).map(x=>x.name),
    ins:hs.filter(h=>h.insider).reduce((s,h)=>s+(h.pct||0),0),
    dev:sup&&r.creatorBalance!=null?(Number(r.creatorBalance)||0)/sup*100:null,
    lock:(r.markets||[]).length?Math.max(0,...r.markets.map(m=>m.lp?.lpLockedPct||0)):null,rugged:!!r.rugged}}

/* =================== правила =================== */
// статус правила: pass ✓ · fail ✕ · unk … (ждём данные) · err ⚠ (API не ответил) · na – (данных нет, не блокирует) · off (выключено)
const SECT={safe:'Безопасность',sig:'Сигналы для входа',warn:'Предупреждения — не блокируют'};
function checks(c){
  const L=c.rcLite;
  // блокчейн — главный источник; если он не ответил, берём то же из rugcheck
  const R=c.rpc||(L?.has?{src:'rc',supply:L.supply,dec:L.dec,mint:L.mint,freeze:L.freeze,bad:L.risk22||[],is22:false,maxOwner:L.maxOwner,top10:L.top10}:null),out=[];
  const put=(sec,k,on,st,t,d,w)=>out.push({sec,k,st:on?st:'off',t,d,w});
  const rpcSt=c.rpcErr&&(c.rpcFails||0)>=3?'err':'unk';
  // безопасность
  if(R){const pr=[...(R.mint?['можно допечатать монеты']:[]),...(R.freeze?['можно заморозить твои токены']:[]),...R.bad];
    put('safe','contract',S.c_contract,pr.length?'fail':'pass','Контракт чистый',pr.length?pr.join(', '):('Mint и freeze отключены'+(R.src==='rc'?' (по rugcheck — блокчейн не ответил)':(R.is22?', Token-2022 без опасных функций':''))),R.mint?'mint':R.freeze?'freeze':R.bad.length?'Token-2022':'контракт')}
  else put('safe','contract',S.c_contract,rpcSt,'Контракт чистый',c.rpcErr?'Блокчейн не ответил: '+c.rpcErr:'Проверяю в блокчейне…','контракт');
  put('safe','owner',S.c_owner,R?(R.maxOwner<=S.ownerMax?'pass':'fail'):rpcSt,'Один владелец ≤ '+S.ownerMax+'%',R?('Крупнейший (кроме пула) держит '+f1(R.maxOwner)+'%'+(R.src==='rc'?' (по rugcheck)':'')):'Проверяю в блокчейне…','кит '+(R?Math.round(R.maxOwner)+'%':''));
  const dev=L?.dev;
  put('safe','dev',S.c_dev,dev!=null?(dev<=S.devMax?'pass':'fail'):(c.rcTried?(S.devStrict?(c.rcErr?'err':'unk'):'na'):'unk'),'Дев ≤ '+S.devMax+'%',dev!=null?('Создатель держит '+f1(dev)+'%'):(c.rcTried?(S.devStrict?'Данных о создателе нет — не пропускаю':'Данных о создателе нет — правило пропущено'):'Жду rugcheck…'),'дев '+(dev!=null?Math.round(dev)+'%':''));
  put('safe','liq',S.c_liq,c.liq?(c.liq>=S.liqMin?'pass':'fail'):'unk','В пуле ≥ '+money(S.liqMin),'Сейчас '+money(c.liq),'мало в пуле');
  if(isPumpSwap(c.dex)){const m=migr(c,R);

function evalCoin(c){
  if(c.status==='pass'||c.status==='miss'||c.status==='fail'||c.status==='nodata')return;
  const ck=checks(c),blk=ck.filter(x=>x.sec!=='warn'&&x.st!=='off'&&x.st!=='na');
  const fails=blk.filter(x=>x.st==='fail'),waits=blk.filter(x=>x.st==='unk'||x.st==='err');
  c.why=fails[0]?.w||'';c.failNow=fails.length>0;c.waitErr=waits.some(x=>x.st==='err');
  c.warnN=ck.filter(x=>x.sec==='warn'&&x.st==='fail').length;
  if(fails.length&&!c.firstFail)c.firstFail=fails[0].k;
  if(inWin(c)){if(!fails.length&&!waits.length){c.status='pass';c.passAt=Date.now();finalize(c,ck)}return}
  c.status=fails.length?'fail':'nodata';finalize(c,ck)}

function finalize(c,ck){if(c.final)return;
  c.final={cfg:cfgKey(),fails:ck.filter(x=>x.sec!=='warn'&&x.st==='fail').map(x=>x.k),first:c.firstFail||null,
    unk:ck.filter(x=>x.sec!=='warn'&&(x.st==='unk'||x.st==='err')).map(x=>x.k),api:ck.some(x=>x.st==='err')}}

    nodata:cs.filter(c=>c.status==='nodata').length,wait:cs.filter(c=>c.status==='wait').length,api:fin.filter(c=>c.final.api).length,miss:Object.values(C).filter(c=>c.status==='miss').length,rule:{}};
  fin.forEach(c=>{c.final.fails.forEach(k=>{(st.rule[k]=st.rule[k]||{all:0,first:0}).all++});if(c.final.first)(st.rule[c.final.first]=st.rule[c.final.first]||{all:0,first:0}).first++});
  st.fin=fin.length;return st}

function sparkSvg(pts,w=64,h=28){
  if(!pts||pts.length<2)return `<svg class="spark" viewBox="0 0 ${w} ${h}"></svg>`;
  const t0=pts[0][0],t1=pts[pts.length-1][0]||t0+1,ys=pts.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),rg=hi-lo||hi||1;
  const X=t=>((t-t0)/((t1-t0)||1))*(w-2)+1,Y=v=>h-2-((v-lo)/rg)*(h-4);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
  const col=ys[ys.length-1]>=ys[0]?'var(--up)':'var(--dn)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d} L${w-1} ${h} L1 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${X(t1).toFixed(1)}" cy="${Y(ys[ys.length-1]).toFixed(1)}" r="2" fill="${col}"/></svg>`}

/* =================== история =================== */
const HOFF=[15,30,60,120,180,300],TGT=[1.5,2,3];
const H=sget('sc_hist2',{});
const curCfg=c=>S.h_all||c.final?.cfg===cfgKey();
function histPass(){return Object.values(C).filter(c=>c.status==='pass'&&c.pair&&curCfg(c))}
function histFail(){return Object.values(C).filter(c=>c.status==='fail'&&c.pair&&curCfg(c)).sort((a,b)=>b.listedAt-a.listedAt).slice(0,40)}
function fetchH(c,prio){const h=H[c.addr];
  const done=h&&h.pts.length&&h.pts[h.pts.length-1][0]>=c.listedAt+5*3600e3-60e3;
  if(done||(h&&Date.now()-h.at<(prio>6?1800e3:240e3))||c._hq)return;
  if(prio>6&&Date.now()-c.listedAt<30*60e3)return;c._hq=1;
  gt(`/pools/${c.pair}/ohlcv/minute?aggregate=1&limit=1000&currency=usd`,prio).then(r=>{
    const l=(r.data?.attributes?.ohlcv_list||[]).map(k=>[k[0]*1000,+k[1],+k[2],+k[3],+k[4]]).filter(k=>k[0]>=c.listedAt-60e3&&k[0]<=c.listedAt+5*3600e3).sort((a,b)=>a[0]-b[0]);
    H[c.addr]={pts:l,at:Date.now()};sset('sc_hist2',H);if(tab==='hist')renderHist()}).catch(()=>{}).finally(()=>{c._hq=0})}
function fetchHist(){histPass().forEach(c=>fetchH(c,6));histFail().forEach(c=>fetchH(c,7))}
setInterval(()=>{if(tab==='hist')fetchHist()},60000);
// вход: прошедшие — момент прохождения + время на покупку; завалившие — конец окна + время на покупку (для сравнения)
function entryOf(c){const h=H[c.addr];if(!h||!h.pts.length)return null;
  const te=(c.status==='pass'?c.passAt:c.listedAt+S.win*60e3)+S.delay*60e3;
  const k=h.pts.find(p=>p[0]>=te);if(!k)return null;return{te,p0:(k[4]||k[1])*(1+S.fee/100)}}
const net=p=>p*(1-S.fee/100);
function xAt(c,min){const h=H[c.addr],e=entryOf(c);if(!e)return null;const t=e.te+min*60e3;
  if(h.pts[h.pts.length-1][0]<t-90e3)return null;let b=null;for(const p of h.pts){if(p[0]<=t)b=p;else break}return b?net(b[4])/e.p0:null}
function pathOf(c){const h=H[c.addr],e=entryOf(c);if(!e)return null;let mx=0,mt=0,mn=Infinity;const hit={};
  for(const p of h.pts){if(p[0]<e.te)continue;if(p[2]>mx){mx=p[2];mt=p[0]}if(p[3]<mn)mn=p[3];
    TGT.forEach(x=>{if(hit[x]==null&&net(p[2])>=x*e.p0)hit[x]=(p[0]-e.te)/60000})}
  return mx?{peak:net(mx)/e.p0,peakMin:(mt-e.te)/60000,dd:isFinite(mn)?(1-net(mn)/e.p0)*100:null,hit}:null}
function renderHist(){
  fetchHist();const cs=histPass().sort((a,b)=>b.passAt-a.passAt),fs=histFail();const box=$('#hist');
  const head=`<div class="chips"><button class="chip${S.h_all?'':' on'}" id="hCur">Только текущие правила</button><button class="chip${S.h_all?' on':''}" id="hAll">Все версии правил</button></div>
    <p class="mut" style="font-size:11px;margin:4px 0 0;font-family:var(--mono)">Учтена комиссия + проскальзывание ${S.fee}% на вход и ${S.fee}% на выход (меняется в «Правила → Время»).</p>`;
  const bind=()=>{$('#hCur').onclick=()=>{S.h_all=false;sset('sc_set',S);renderHist()};$('#hAll').onclick=()=>{S.h_all=true;sset('sc_set',S);renderHist()};
    box.querySelectorAll('.hcard').forEach(e=>e.onclick=()=>openCoin(e.dataset.a))};
  if(!cs.length&&!fs.length){box.innerHTML=head+`<div class="empty">Пока пусто.<br>Здесь будет: что стало с монетами, прошедшими правила, за первые 5 часов — и для сравнения с теми, что завалили.<br>Зелёная зона на графике — момент прохождения + ${S.delay} мин на покупку.</div>`;bind();return}
  const col=v=>v==null?'':v>=1?'up':'dn';
  let rows='';for(const m of HOFF){const v=cs.map(c=>xAt(c,m)).filter(x=>x!=null),w=fs.map(c=>xAt(c,m)).filter(x=>x!=null);
    rows+=`<tr><td>через ${dur(m)}</td><td class="${col(med(v))}">${xf(med(v))}</td><td>${v.length?Math.round(v.filter(x=>x>=1).length/v.length*100)+'%':'—'}</td><td class="${col(med(w))}">${xf(med(w))}</td><td>${w.length?Math.round(w.filter(x=>x>=1).length/w.length*100)+'%':'—'}</td></tr>`}
  const ps=cs.map(pathOf).filter(Boolean),pf=fs.map(pathOf).filter(Boolean);
  const hr=(arr,x)=>{const t=arr.map(p=>p.hit[x]).filter(v=>v!=null);return arr.length?Math.round(t.length/arr.length*100)+'%'+(t.length?' · ~'+dur(med(t)):''):'—'};
  let hrows='';TGT.forEach(x=>{hrows+=`<tr><td>дошли до ×${x}</td><td>${hr(ps,x)}</td><td>${hr(pf,x)}</td></tr>`});
  hrows+=`<tr><td>средний пик</td><td class="up">${xf(avg(ps.map(p=>p.peak)))}</td><td>${xf(avg(pf.map(p=>p.peak)))}</td></tr>`;
  hrows+=`<tr><td>средняя просадка</td><td class="dn">${ps.length?'−'+Math.round(avg(ps.map(p=>p.dd).filter(x=>x!=null)))+'%':'—'}</td><td class="dn">${pf.length?'−'+Math.round(avg(pf.map(p=>p.dd).filter(x=>x!=null)))+'%':'—'}</td></tr>`;
  box.innerHTML=head+`<div class="agg big"><h3>Прошли (${cs.length}) против завалили (${fs.length})</h3>
    <p class="mut" style="margin:0;font-size:12px">Вход у прошедших — прохождение правил + ${S.delay} мин. У заваливших — конец окна + ${S.delay} мин, как если бы ты купил их. Медиана, ×1 = в ноль после комиссий.</p>
    ${overlaySvg(cs)}
    <div class="tbl"><table><tr><th>После входа</th><th>прошли</th><th>в плюсе</th><th>завалили</th><th>в плюсе</th></tr>${rows}</table></div>
    <div class="tbl"><table><tr><th>За 5 ч</th><th>прошли</th><th>завалили</th></tr>${hrows}</table></div>
    <p class="mut" style="font-size:11px;margin:6px 0 0">Если «прошли» не лучше, чем «завалили» — правила не работают, их надо менять. Завалившие подгружаются медленно (лимит API), только старше 30 мин.</p></div>
    <div class="sec-h">Прошедшие · первые 5 ч с витрины</div>
    ${cs.map(c=>{const p=pathOf(c);const nowX=xAt(c,Math.max(0,Math.min(300,(Date.now()-c.passAt)/60000-S.delay-1)));
      return `<div class="hcard" data-a="${c.addr}"><div class="hh">${avHtml(c)}<div class="mid" style="flex:1"><div class="nm">${esc(c.name)}<span>${esc(c.sym)}</span></div>
      <div class="l2">пик <span class="up">${p?xf(p.peak):'—'}</span>${p?' через '+dur(p.peakMin):''} · просадка <span class="dn">${p&&p.dd!=null?'−'+Math.round(p.dd)+'%':'—'}</span> · сейчас <span class="${(nowX||0)>=1?'up':'dn'}">${xf(nowX)}</span></div></div></div>
      ${coinSvg(c)}</div>`}).join('')}`;
  bind()}
function coinSvg(c){const h=H[c.addr];const W=360,Hh=90;
  if(!h||h.pts.length<2)return `<svg viewBox="0 0 ${W} ${Hh}"><text x="${W/2}" y="${Hh/2}" fill="var(--mut)" font-size="11" text-anchor="middle" font-family="monospace">загружаю график…</text></svg>`;
  const t0=c.listedAt,t1=c.listedAt+5*3600e3,ys=h.pts.map(p=>p[4]),lo=Math.min(...ys),hi=Math.max(...ys),rg=hi-lo||1;
  const X=t=>((t-t0)/(t1-t0))*(W-4)+2,Y=v=>Hh-12-((v-lo)/rg)*(Hh-20);
  const d=h.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[4]).toFixed(1)).join('');
  const e1=X(c.passAt),e2=X(c.passAt+S.delay*60e3);const e=entryOf(c);
  let ticks='';for(let i=1;i<5;i++){const x=X(t0+i*3600e3);ticks+=`<line x1="${x}" x2="${x}" y1="0" y2="${Hh-10}" stroke="var(--line)"/><text x="${x}" y="${Hh-1}" fill="var(--mut)" font-size="9" text-anchor="middle" font-family="monospace">${i}ч</text>`}
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${ticks}
    <rect x="${e1.toFixed(1)}" y="0" width="${Math.max(3,e2-e1).toFixed(1)}" height="${Hh-10}" fill="var(--up)" opacity=".28"/>
    ${e?`<line x1="0" x2="${W}" y1="${Y(e.p0/(1+S.fee/100)).toFixed(1)}" y2="${Y(e.p0/(1+S.fee/100)).toFixed(1)}" stroke="var(--up)" stroke-dasharray="3 3" opacity=".6"/>`:''}
    <path d="${d}" fill="none" stroke="var(--fg)" stroke-width="1.4"/></svg>`}
function overlaySvg(cs){const W=360,Hh=220,M=300;const series=[];
  cs.forEach(c=>{const h=H[c.addr],e=entryOf(c);if(!e)return;series.push(h.pts.filter(p=>p[0]>=e.te&&p[0]<=e.te+M*60e3).map(p=>[(p[0]-e.te)/60000,net(p[4])/e.p0]))});
  if(!series.length)return `<svg viewBox="0 0 ${W} ${Hh}"><text x="${W/2}" y="${Hh/2}" fill="var(--mut)" font-size="11" text-anchor="middle" font-family="monospace">графики подгружаются…</text></svg>`;
  let mx=2;series.forEach(s=>s.forEach(p=>{if(p[1]>mx)mx=p[1]}));mx=Math.min(mx,100);const mn=0.1;
  const X=m=>28+(m/M)*(W-34),Y=v=>{const l=Math.log10(Math.max(mn,Math.min(mx,v)));return 8+(1-(l-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn)))*(Hh-28)};
  let g='';[0.25,0.5,1,2,5,10,20,50].filter(v=>v<=mx).forEach(v=>{g+=`<line x1="28" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===1?'var(--up)':'var(--line)'}" ${v===1?'stroke-dasharray="3 3"':''}/><text x="24" y="${Y(v)+3}" fill="var(--mut)" font-size="9" text-anchor="end" font-family="monospace">×${v}</text>`});
  [60,120,180,240,300].forEach(m=>g+=`<text x="${X(m)}" y="${Hh-4}" fill="var(--mut)" font-size="9" text-anchor="middle" font-family="monospace">${m/60}ч</text>`);
  const lines=series.map(s=>`<path d="${s.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--acc)" stroke-width="1" opacity=".45"/>`).join('');
  let md='';for(let m=0;m<=M;m+=5){const v=series.map(s=>{let b=null;for(const p of s){if(p[0]<=m)b=p;else break}return b&&m-b[0]<10?b[1]:null}).filter(x=>x!=null);if(v.length)md+=(md?'L':'M')+X(m).toFixed(1)+' '+Y(med(v)).toFixed(1)}
  return `<svg viewBox="0 0 ${W} ${Hh}">${g}<rect x="28" y="8" width="4" height="${Hh-28}" fill="var(--up)" opacity=".35"/>${lines}${md?`<path d="${md}" fill="none" stroke="var(--up)" stroke-width="2.4"/>`:''}
    <text x="${W-4}" y="18" fill="var(--up)" font-size="10" text-anchor="end" font-family="monospace">— медиана</text></svg>`}

 {n:5,t:'Лок пула',k:'lock',tg:['c_lock'],text:()=>`PumpSwap: только настоящая миграция с pump.fun (1 млрд монет, адрес …pump, монета была на кривой раньше пула) — тогда пул сожжён. Пул, созданный вручную, не проходит. Raydium/Meteora: заблокировано не меньше <em>${S.lockMin}%</em> пула.`,why:'Пул, созданный вручную, создатель может забрать вместе с деньгами — так сливаются «лесенки».',sl:[['lockMin',50,100,5,v=>v+'%']]},
 {h:'Сигналы для входа'},
 {n:6,t:'Давление покупок',k:'press',tg:['c_press'],text:()=>`За последние 5 мин покупок в <em>×${S.pressMin}</em> больше, чем продаж.`,why:'Покупают сильнее, чем продают — спрос есть прямо сейчас.',sl:[['pressMin',0.5,3,0.1,v=>'×'+v]]},
 {n:'6а',t:'Лесенка',k:'sells',tg:['c_sells'],text:()=>`За 5 мин продаж хотя бы <em>${S.sellMin2}%</em> от покупок (если сделок 15 и больше).`,why:'Только зелёные свечи и никто не продаёт — график рисуют боты. Живая монета всегда кто-то продаёт.',sl:[['sellMin2',0,40,1,v=>v+'%']]},
 {n:7,t:'Живой объём',k:'vol5',tg:['c_vol5'],text:()=>`Объём торгов за 5 мин не меньше <em>${money(S.vol5Min)}</em>.`,why:'Монета реально торгуется, а не стоит.',sl:[['vol5Min',0,20000,250,v=>money(v)]]},
 {n:8,t:'Покупатели',k:'buyers',tg:['c_buyers'],text:()=>`С момента появления купили минимум <em>${S.buyersMin}</em> разных кошельков.`,why:'Много сделок от пары кошельков — это боты. Важно количество людей.',sl:[['buyersMin',0,200,5,v=>v+' кошельков']]},
 {n:9,t:'Не сливают',k:'dd',tg:['c_dd'],text:()=>`Цена не упала больше чем на <em>${S.ddMax}%</em> от своего пика с момента появления.`,why:'Если уже идёт слив — не лезь под него.',sl:[['ddMax',10,80,5,v=>v+'%']]},
 {h:'Предупреждения — показываются, но не блокируют'},
 {n:'⚠',t:'Инсайдеры',k:null,tg:['w_ins'],text:()=>`Связанные с созданием кошельки держат больше <em>${S.insMax}%</em>.`,why:'Оценка rugcheck неточная, поэтому только предупреждение.',sl:[['insMax',0,60,1,v=>v+'%']]},
 {n:'⚠',t:'Топ-10',k:null,tg:['w_top10'],text:()=>`10 крупнейших владельцев держат больше <em>${S.top10Max}%</em>.`,why:'На старте это нормально, но стоит знать.',sl:[['top10Max',10,80,1,v=>v+'%']]},
 {n:'⚠',t:'Уже улетела',k:null,tg:['w_pump'],text:()=>`С момента появления цена выросла больше чем в <em>×${S.pumpMax}</em>.`,why:'Можешь войти на хаях.',sl:[['pumpMax',1.2,20,0.1,v=>'×'+v]]},
 {n:'⚠',t:'Клон',k:null,tg:['w_clone'],text:()=>'Монета с таким же названием уже появлялась.',why:'Часто скам, но не всегда.'},
 {h:'Время'},
 {n:'⏱',t:'Лента и история',k:null,tg:null,text:()=>`Хранить ленту <em>${S.keepH} ч</em>. На покупку тебе нужно <em>${S.delay} мин</em> — от этого момента считается вход в Истории. Новые пары проверяются каждые <em>${S.poll} сек</em>. Комиссия и проскальзывание в Истории — <em>${S.fee}%</em> на вход и на выход.`,why:'GeckoTerminal даёт бесплатно только 10 запросов в минуту, поэтому чаще 20 сек нельзя.',sl:[['keepH',1,24,1,v=>v+' ч'],['delay',0,10,0.5,v=>v+' мин'],['poll',20,90,5,v=>v+' сек'],['fee',0,10,0.5,v=>'комиссия '+v+'%']]}];
let saveT=0;
function saveRules(){clearTimeout(saveT);saveT=setTimeout(()=>{sset('sc_set',S);evalAll();render()},400)}
function updRuleCounts(){const st=stats();
  const s=$('#rulesSum');if(s)s.innerHTML=`<div class="sum"><div><b>${st.found}</b><small>найдено</small></div><div><b class="up">${st.pass}</b><small>прошли</small></div><div><b class="dn">${st.fail}</b><small>завалили</small></div><div><b class="warn">${st.nodata}</b><small>нет данных</small></div><div><b style="color:var(--acc)">${st.wait}</b><small>проверяю</small></div><div><b class="mut">${st.miss}</b><small>пропущено</small></div></div>
    <p class="mut" style="font-size:11px;margin:6px 0 0">Из-за ошибок API: ${st.api}. Счёт по монетам, у которых окно уже закрылось (${st.fin}).</p>`;
  document.querySelectorAll('[data-cnt]').forEach(e=>{const r=st.rule[e.dataset.cnt];
    e.innerHTML=st.fin?`Завалили <b>${r?.all||0}</b> из ${st.fin} (${Math.round((r?.all||0)/st.fin*100)}%) · первым правилом: <b>${r?.first||0}</b>`:'Счётчик появится, когда закроется окно у первых монет'})}
function renderRules(){
  $('#rulesHead').innerHTML=`В «Прошли» попадает монета, которая прошла ВСЕ включённые правила безопасности и сигналы за первые <b style="color:var(--fg)">${S.win} мин</b>. Меняется сразу.`;
  $('#rules').innerHTML='<div id="rulesSum"></div>'+RULES.map((r,i)=>{if(r.h)return `<div class="sec-h">${r.h}</div>`;const on=!r.tg||r.tg.every(k=>S[k]);
    return `<div class="rule${on?'':' off'}" data-i="${i}"><div class="rh"><h3>${/^\d/.test(String(r.n))?r.n+'. ':r.n+' '}${r.t}</h3>${r.tg?`<button class="tg${on?'':' off'}" aria-label="Включить правило"></button>`:''}</div>
    <p class="rtx">${r.text()}</p><div class="why">${r.why}</div>${r.k?`<div class="rcnt" data-cnt="${r.k}"></div>`:''}
    ${(r.sl||[]).map(([k,mn,mx,st,f])=>`<div class="slw"><div class="sll"><b data-l="${k}">${f(S[k])}</b><span>${f(mn)} … ${f(mx)}</span></div><input type="range" id="r_${k}" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}"></div>`).join('')}</div>`}).join('');
  $('#rules').querySelectorAll('.rule').forEach(el=>{const r=RULES[+el.dataset.i];
    const tg=el.querySelector('.tg');if(tg)tg.onclick=()=>{const on=!r.tg.every(k=>S[k]);r.tg.forEach(k=>S[k]=on);el.classList.toggle('off',!on);tg.classList.toggle('off',!on);saveRules()};
    el.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.k;S[k]=+inp.value;
      const f=r.sl.find(x=>x[0]===k)[4];el.querySelector(`[data-l="${k}"]`).textContent=f(S[k]);el.querySelector('.rtx').innerHTML=r.text();
      if(k==='win')$('#rulesHead b').textContent=S.win+' мин';saveRules()})});
  const hk=document.createElement('div');hk.className='rule';
  hk.innerHTML=`<div class="rh"><h3>🔑 Ключ Helius (необязательно)</h3></div><p class="rtx">Бесплатные узлы Solana часто не отвечают сайтам. С бесплатным ключом Helius проверка контракта и китов работает стабильно. Получить: <b>helius.dev</b> → Sign up → скопировать API key.</p>
    <div class="inrow"><input id="hkey" placeholder="вставь ключ сюда" autocomplete="off" spellcheck="false" value="${esc(S.helius)}"><button class="btn" id="hsave">Сохранить</button></div><div class="why" id="hst">${S.helius?'Ключ сохранён':'Без ключа — запасной вариант через rugcheck'}</div>`;
  $('#rules').appendChild(hk);
  $('#hsave').onclick=()=>{S.helius=$('#hkey').value.trim();sset('sc_set',S);$('#hst').textContent=S.helius?'Ключ сохранён, проверяю…':'Ключ удалён';
    rpc('getHealth',[]).then(()=>{$('#hst').textContent=S.helius?'✓ Ключ работает':'✓ Блокчейн отвечает'}).catch(e=>{$('#hst').textContent='✕ Не отвечает: '+e.message})};
  updRuleCounts()}

/* =================== старт =================== */
evalAll();render();boot();rcLoop();rpcLoop();setTimeout(pollDS,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollDS()});
</script>

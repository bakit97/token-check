<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проверка токенов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Тёмный торговый терминал: плотные строки, моно-цифры, зелёный/красный только для смысла */
:root{
  --bg:#0a0c10;--panel:#11151b;--panel2:#161b23;--line:#222a35;--fg:#e6e9ee;--mut:#7d8796;
  --acc:#5b8cff;--up:#22d17b;--dn:#ff4d5e;--warn:#f5c04a;--new:#22d17b;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Manrope',system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:14px/1.35 var(--sans);-webkit-tap-highlight-color:transparent;
  padding-bottom:max(24px,env(safe-area-inset-bottom))}
.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.warn{color:var(--warn)}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-top:max(8px,env(safe-area-inset-top))}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.brand{font-weight:800;letter-spacing:.02em;font-size:16px}
.live{font:700 11px var(--mono);color:var(--up);display:flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 1.6s infinite}
.live.off{color:var(--dn)}.live.off i{background:var(--dn);animation:none}
@keyframes pulse{50%{opacity:.25}}
.store{font:11px var(--mono);color:var(--mut);margin-left:auto}
.store.bad{color:var(--dn)}
.gear{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:17px}
.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
.tab{flex:1 0 auto;min-width:max-content;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab b{font-family:var(--mono);font-weight:700;opacity:.8;margin-left:3px}
.stat{font:11px var(--mono);color:var(--mut);padding:8px 0 2px;display:flex;gap:10px;flex-wrap:wrap}

/* rows */
.list{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 64px auto;gap:8px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;position:relative;overflow:hidden}
.row:active{background:var(--panel2)}
.row.enter{animation:enter .6s cubic-bezier(.2,.8,.2,1)}
.row.enter::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--new);animation:glow 8s forwards;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes glow{0%,60%{opacity:1}100%{opacity:0}}
.row.fl-up{animation:flu .7s}.row.fl-dn{animation:fld .7s}
@keyframes flu{0%{background:rgba(34,209,123,.22)}100%{background:var(--panel)}}
@keyframes fld{0%{background:rgba(255,77,94,.22)}100%{background:var(--panel)}}
.row.inwin{border-color:rgba(34,209,123,.55)}
.av{width:34px;height:34px;border-radius:50%;background:var(--panel2);object-fit:cover;display:block}
.av.ph{display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);color:var(--mut)}
.mid{min-width:0}
.nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nm span{color:var(--mut);font-weight:600;font-size:12px;margin-left:4px}
.l2,.l3{font:11px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 .age{color:var(--fg);font-weight:700}
.l2 .age.fresh{color:var(--up)}
.l2 .tok{color:var(--dn)}
.spark{width:64px;height:28px;display:block}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.px{font:700 12px var(--mono)}
.badge{font:700 10px var(--mono);padding:3px 6px;border-radius:6px;white-space:nowrap}
.b-pass{background:rgba(34,209,123,.15);color:var(--up)}
.b-fail{background:rgba(255,77,94,.14);color:var(--dn)}
.b-wait{background:rgba(91,140,255,.15);color:var(--acc)}
.b-late{background:rgba(245,192,74,.14);color:var(--warn)}
.b-miss{background:var(--panel2);color:var(--mut)}
.empty{padding:28px 10px;text-align:center;color:var(--mut);font-size:13px;line-height:1.5}
.sec-h{font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 2px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-in{position:relative;width:100%;max-height:92vh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:6px max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.dh{display:flex;gap:10px;align-items:center;padding-right:40px}
.dh .av{width:44px;height:44px}
.addr{font:11px var(--mono);color:var(--mut);word-break:break-all}
.copy{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;font-size:11px;margin-top:4px}
.chart{width:100%;height:340px;border:0;border-radius:12px;background:#0f1218;margin-top:10px;display:block}
.seg{display:flex;gap:4px;margin-top:8px}
.seg button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:12px;font-weight:700}
.seg button.on{color:var(--fg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}
.cell small{display:block;font:10px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.cell b{font:700 13px var(--mono)}
.verdict{margin-top:10px;padding:12px;border-radius:12px;font-weight:800;font-size:15px}
.v-pass{background:rgba(34,209,123,.12);color:var(--up);border:1px solid rgba(34,209,123,.4)}
.v-fail{background:rgba(255,77,94,.11);color:var(--dn);border:1px solid rgba(255,77,94,.4)}
.v-wait{background:rgba(91,140,255,.1);color:var(--acc);border:1px solid rgba(91,140,255,.4)}
.v-late{background:rgba(245,192,74,.1);color:var(--warn);border:1px solid rgba(245,192,74,.4)}
.v-miss{background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.verdict small{display:block;font-weight:600;font-size:12px;opacity:.85;margin-top:2px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:8px}
.grp h4{margin:8px 0 2px;font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ck{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.grp h4+.ck{border-top:0}
.ck i{font-style:normal;width:18px;flex:none;text-align:center;font-weight:800}
.ck .ok{color:var(--up)}.ck .no{color:var(--dn)}.ck .wt{color:var(--acc)}.ck .off{color:var(--mut)}.ck .er{color:var(--warn)}
.ck span{display:block;color:var(--mut);font-size:12px}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.links a{padding:10px 4px;text-align:center;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12px;font-weight:700}
.links a.buy{background:var(--up);color:#04140b;border-color:var(--up)}

/* check tab */
.inrow{display:flex;gap:6px;margin-top:10px}
.inrow input{flex:1;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:13px var(--mono)}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:800}

/* settings */
.set h3{margin:14px 0 4px;font-size:15px}
.set .hint{color:var(--mut);font-size:12px;margin:0 0 6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.opt label{font-weight:700;font-size:13px}
.opt p{grid-column:1/-1;margin:0;color:var(--mut);font-size:12px}
.opt input[type=number]{width:84px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:13px var(--mono);text-align:right}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--up)}
.rowopt{display:flex;gap:6px;align-items:center}

/* history */
.agg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.agg h3{margin:0 0 4px;font-size:14px}
.tbl{overflow-x:auto;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;font:12px var(--mono)}
.tbl th,.tbl td{padding:5px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mut);font-weight:500}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px}
.hcard .hh{display:flex;gap:8px;align-items:center}
.hcard .av{width:26px;height:26px}
.hcard svg{width:100%;height:90px;display:block;margin-top:4px}
.big svg{height:220px}

/* фильтры и правила */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:700;font-size:12px}
.chip.on{background:rgba(34,209,123,.14);border-color:rgba(34,209,123,.55);color:var(--up)}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.rule.off{opacity:.55}
.rule .rh{display:flex;align-items:center;gap:8px}
.rule .rh h3{margin:0;font-size:15px;flex:1}
.tg{width:44px;height:26px;border-radius:13px;background:var(--up);position:relative;flex:none;border:0}
.tg::after{content:'';position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.off{background:var(--line)}.tg.off::after{right:21px}
.rule p{margin:6px 0 0;font-size:13px;line-height:1.45}
.rule p em{font-style:normal;color:var(--up);font-family:var(--mono);font-weight:700}
.rule .why{color:var(--mut);font-size:12px;margin-top:4px}
.slw{margin-top:10px}
.slw .sll{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mut)}
.slw .sll b{color:var(--fg)}
.slw input[type=range]{width:100%;accent-color:var(--up);margin:6px 0 0;height:26px}
.rcnt{margin-top:6px;font:11px var(--mono);color:var(--mut)}.rcnt b{color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center}
.sum b{display:block;font:700 16px var(--mono)}.sum small{font:10px var(--mono);color:var(--mut)}
/* сделки */
.trs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.trs h4{margin:0;font:700 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.tseg{display:flex;gap:4px;margin-top:8px}
.tseg button{flex:1;padding:6px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:12px;font-weight:700}
.tseg button.on{color:var(--fg);border-color:var(--acc)}
.trsum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.trsum div{border-radius:9px;padding:8px;text-align:center;border:1px solid}
.trsum .b{background:rgba(34,209,123,.08);border-color:rgba(34,209,123,.35);color:var(--up)}
.trsum .s{background:rgba(255,77,94,.08);border-color:rgba(255,77,94,.35);color:var(--dn)}
.trsum b{display:block;font:700 16px var(--mono)}.trsum small{font:11px var(--mono);opacity:.85}
.trbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.trbar i{display:block;background:var(--up)}.trbar u{display:block;background:var(--dn);flex:1}
.trmeta{font:11px var(--mono);color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.trl{max-height:380px;overflow-y:auto;margin-top:6px}
.tr{display:grid;grid-template-columns:42px 16px minmax(0,1fr) auto 64px;gap:6px;align-items:center;padding:6px 2px;border-top:1px solid var(--line);font:12px var(--mono)}
.tr .tt{color:var(--mut)}.tr .tu{font-weight:700}.tr .tp{color:var(--mut);text-align:right}
.tr.buy .tk,.tr.buy .tu{color:var(--up)}.tr.sell .tk,.tr.sell .tu{color:var(--dn)}
.tr.big .tu{font-size:13px}.tr.big{background:rgba(245,192,74,.06)}
.tr .tw{color:var(--mut);text-decoration:none;text-align:right;overflow:hidden;text-overflow:ellipsis}
.tr.enter{animation:trin 1.6s ease-out}@keyframes trin{0%{background:rgba(91,140,255,.35)}100%{background:transparent}}
/* исследование */
.rtab td,.rtab th{font-size:11px}.rtab td:first-child,.rtab th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}.rtab td:first-child{white-space:normal;min-width:150px;font-family:var(--sans);font-size:12px}
.rtab tr.rh td{color:var(--mut);font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:12px;text-align:left}
.rtab tr.star td{background:rgba(245,192,74,.07)}.rtab tr.star td:first-child{color:var(--warn);font-weight:700}
.rgrp{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:6px;padding:8px 10px}
.rgrp summary{cursor:pointer;font-weight:700}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
.rrow .av{width:30px;height:30px}.rrow .rt{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}.rrow .nm,.rrow .l2{display:block}.rrow .mid{min-width:0;overflow:hidden}
.sum div small{display:block}
/* лаборатория */
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;cursor:pointer}
.lrow:active{background:var(--panel2)}.lrow .mid{min-width:0;overflow:hidden}.lrow .l2{display:block}.lrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;white-space:nowrap}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left}
.goal span{font:700 10px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.goal b{font:700 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goal i{font-style:normal;color:var(--acc);font-size:12px;font-weight:700}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.big3>*{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
.big3 button.on{border-color:var(--acc)}.big3 b{display:block;font:700 24px var(--mono)}.big3 small{font:11px var(--mono);color:var(--mut)}
.qual{margin-top:8px;font-size:12px}.qual summary{cursor:pointer;color:var(--mut);font-family:var(--mono);font-size:11px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-top:6px}.qgrid span{color:var(--mut)}.qgrid b{font-family:var(--mono);text-align:right}
.tagc{font:700 9px var(--mono);padding:1px 5px;border-radius:5px;background:rgba(91,140,255,.15);color:var(--acc);vertical-align:middle}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.fbar .chip{padding:5px 10px}
.frz{opacity:.6;pointer-events:none}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fc,#5b8cff);margin-right:5px;vertical-align:middle}.fsel .chip.on{border-color:var(--fc);color:var(--fg);background:var(--panel2)}
.addc{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}.addc summary{cursor:pointer;font-weight:700;color:var(--acc)}
.wrapc{flex-wrap:wrap;overflow:visible}
.hcard{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand">SOL·СКАН</div>
    <div class="live" id="live"><i></i><span>LIVE</span></div>
    <div class="store" id="store">память…</div>
  </div>
  <nav class="tabs">
    <button class="tab on" data-t="all">Все<b id="nAll">0</b></button>
    <button class="tab" data-t="pass">Прошли<b id="nPass">0</b></button>
    <button class="tab" data-t="hist">История</button>
    <button class="tab" data-t="research">Исследование</button>
    <button class="tab" data-t="auto">Авто</button>
    <button class="tab" data-t="rules">Фильтры</button>
    <button class="tab" data-t="check">Проверка</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-all">
    <div class="chips"><button class="chip" id="fFresh"></button><button class="chip" id="fMig">🎓 Миграции</button><button class="chip" id="fScam">🚫 Без скама</button><button class="chip" id="fLiq"></button></div>
    <div class="stat" id="statAll"></div>
    <div class="list" id="lAll"><div class="empty">Загружаю новые пары…</div></div>
  </section>
  <section id="v-pass" hidden>
    <div class="stat" id="statPass"></div>
    <div class="list" id="lPass"></div>
  </section>
  <section id="v-hist" hidden>
    <div id="hist"></div>
  </section>
  <section id="v-research" hidden><div id="research"></div></section>
  <section id="v-auto" hidden><div id="auto"></div></section>
  <section id="v-rules" hidden><div id="rules"></div></section>
  <section id="v-check" hidden>
    <div class="inrow"><input id="addr" placeholder="Адрес контракта" autocomplete="off" spellcheck="false"><button class="btn" id="go">Проверить</button></div>
    <div id="out"><p class="mut" style="margin-top:10px">Вставь адрес любой монеты Solana — проверю по тем же правилам, что и ленту.</p></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-in"><div class="grab"></div><button class="x" data-close aria-label="Закрыть">✕</button><div id="sheetBody"></div></div></div>

<script src="lab-core.js"></script>
<script>
'use strict';
/* =================== утилиты =================== */
const DS='https://api.dexscreener.com', GT='https://api.geckoterminal.com/api/v2/networks/solana', RC='https://api.rugcheck.xyz/v1';
const RPCS=['https://solana-rpc.publicnode.com','https://api.mainnet-beta.solana.com'];

/* base58 + ed25519 on-curve + findProgramAddress — для проверки кривой pump.fun */
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function b58dec(s){let n=0n;for(const ch of s){const i=B58.indexOf(ch);if(i<0)throw new Error('base58');n=n*58n+BigInt(i)}
  const out=[];while(n>0n){out.push(Number(n&255n));n>>=8n}for(const ch of s){if(ch==='1')out.push(0);else break}return new Uint8Array(out.reverse())}
function b58enc(b){let n=0n;for(const x of b)n=(n<<8n)+BigInt(x);let s='';while(n>0n){s=B58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
const EP=(1n<<255n)-19n;
const emod=a=>((a%EP)+EP)%EP;
function epow(b,e){let r=1n;b=emod(b);while(e>0n){if(e&1n)r=r*b%EP;b=b*b%EP;e>>=1n}return r}
const ED=emod(-121665n*epow(121666n,EP-2n));
const ESQ=epow(2n,(EP-1n)/4n);
function onCurve(bytes){let y=0n;for(let i=31;i>=0;i--)y=(y<<8n)+BigInt(bytes[i]);y&=(1n<<255n)-1n;if(y>=EP)return false;
  const y2=y*y%EP,u=emod(y2-1n),v=emod(ED*y2+1n);
  const v3=v*v%EP*v%EP,v7=v3*v3%EP*v%EP;let x=u*v3%EP*epow(u*v7%EP,(EP-5n)/8n)%EP;
  const vx2=v*x%EP*x%EP;if(vx2===u)return true;if(vx2===emod(-u))return true;return false}
async function sha256(b){return new Uint8Array(await crypto.subtle.digest('SHA-256',b))}
async function findPDA(seeds,prog){const pb=b58dec(prog);
  for(let bump=255;bump>=0;bump--){const parts=[...seeds,new Uint8Array([bump]),pb,new TextEncoder().encode('ProgramDerivedAddress')];
    const len=parts.reduce((s,p)=>s+p.length,0),buf=new Uint8Array(len);let o=0;parts.forEach(p=>{buf.set(p,o);o+=p.length});
    const h=await sha256(buf);if(!onCurve(h))return b58enc(h)}throw new Error('no PDA')}
const PUMP='6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P';
const bondingCurveOf=mint=>findPDA([new TextEncoder().encode('bonding-curve'),b58dec(mint)],PUMP);

const PUMP_AMM='pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA',WSOL='So11111111111111111111111111111111111111112';
const USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
async function canonicalPoolOf(mint,quote=WSOL){const te=new TextEncoder();
  const auth=await findPDA([te.encode('pool-authority'),b58dec(mint)],PUMP);
  return findPDA([te.encode('pool'),new Uint8Array([0,0]),b58dec(auth),b58dec(mint),b58dec(quote)],PUMP_AMM)}

    const p=pools.find(x=>x.pairAddress===c.pair)||pools.sort((x,y)=>(y.liquidity?.usd||0)-(x.liquidity?.usd||0))[0];const prev=c.price;

// Экономия кредитов Helius:
//  • ручной пул PumpSwap определяется без запросов (адрес канонического пула считается локально) — 0 кредитов
//  • контракт, кривая, supply не меняются — запрашиваются один раз
//  • держатели обновляются раз в 90 сек и только пока монета может пройти
async function rpcCheck(c){
  if(!c.st){
    if(isPumpSwap(c.dex)&&c.canon===true){ // монету создал pump.fun: mint/freeze отключены платформой, лишних функций нет — контракт не запрашиваем
      c.st={pumpfun:true,is22:false,supply:1e9,dec:6,mint:false,freeze:false,bad:[]}}
    else{
      const mi=await rpc('getAccountInfo',[c.addr,{encoding:'jsonParsed'}]);rpcUsed(1);
      const v=mi?.value;if(!v)throw new Error('токен не найден');
      const info=v.data?.parsed?.info||{};const is22=v.owner===T22;const bad=[];
      (info.extensions||[]).forEach(e=>{const s=e.state||{};
        if(e.extension==='transferFeeConfig'){const bps=Math.max(+(s.newerTransferFee?.transferFeeBasisPoints||0),+(s.olderTransferFee?.transferFeeBasisPoints||0));if(bps>0)bad.push('комиссия '+bps/100+'% на перевод')}
        if(e.extension==='transferHook'&&s.programId)bad.push('перехват переводов');
        if(e.extension==='permanentDelegate'&&s.delegate)bad.push('вечный делегат');
        if(e.extension==='nonTransferable')bad.push('нельзя переводить');
        if(e.extension==='defaultAccountState'&&/frozen/i.test(s.accountState||''))bad.push('счета заморожены');
        if(/pausable/i.test(e.extension))bad.push('можно поставить на паузу')});
      const dec=+info.decimals||0,supply=(+info.supply||0)/10**dec;
      c.st={is22,supply,dec,mint:!!info.mintAuthority,freeze:!!info.freezeAuthority,bad}}}
  const st=c.st;let owners=[];
  const hard=st.mint||st.freeze||st.bad.length;
  if(!hard){ // держателей смотрим, только если монета ещё может пройти
    const la=await rpc('getTokenLargestAccounts',[c.addr]);rpcUsed(1);

function fetchH(c,prio){const h=H[c.addr];
  const done=h&&h.pts.length&&h.pts[h.pts.length-1][0]>=c.listedAt+5*3600e3-60e3;
  if(done||(h&&Date.now()-h.at<(prio>6?1800e3:240e3))||c._hq)return;

// вход: прошедшие — момент прохождения + время на покупку; завалившие — конец окна + время на покупку (для сравнения)
function entryOf(c){const h=H[c.addr];if(!h||!h.pts.length)return null;
  const te=(c.status==='pass'?c.passAt:c.listedAt+passOff())+S.delay*60e3;
  const k=h.pts.find(p=>p[0]>=te);if(!k)return null;return{te,p0:(k[4]||k[1])*(1+S.fee/100)}}
const net=p=>p*(1-S.fee/100);

function passOff(){const v=histPass().map(c=>c.passAt-c.listedAt).filter(x=>x>=0);return v.length?med(v):S.win*60e3/2}
function xAt(c,min){const h=H[c.addr],e=entryOf(c);if(!e)return null;const t=e.te+min*60e3;
  if(h.pts[h.pts.length-1][0]<t-90e3)return null;let b=null;for(const p of h.pts){if(p[0]<=t)b=p;else break}return b?net(b[4])/e.p0:null}
function pathOf(c){const h=H[c.addr],e=entryOf(c);if(!e)return null;let mx=0,mt=0,mn=Infinity;const hit={};
  for(const p of h.pts){if(p[0]<e.te)continue;if(p[2]>mx){mx=p[2];mt=p[0]}if(p[3]<mn)mn=p[3];
    TGT.forEach(x=>{if(hit[x]==null&&net(p[2])>=x*e.p0)hit[x]=(p[0]-e.te)/60000})}
  return mx?{peak:net(mx)/e.p0,peakMin:(mt-e.te)/60000,dd:isFinite(mn)?(1-net(mn)/e.p0)*100:null,hit}:null}
function renderHist(){

  let hrows='';TGT.forEach(x=>{hrows+=`<tr><td>дошли до ×${x}</td><td>${hr(ps,x)}</td><td>${hr(pf,x)}</td></tr>`});

function coinSvg(c){const h=H[c.addr];const W=360,Hh=90;
  if(!h||h.pts.length<2)return `<svg viewBox="0 0 ${W} ${Hh}"><text x="${W/2}" y="${Hh/2}" fill="var(--mut)" font-size="11" text-anchor="middle" font-family="monospace">загружаю график…</text></svg>`;
  const t0=c.listedAt,t1=c.listedAt+5*3600e3,ys=h.pts.map(p=>p[4]),lo=Math.min(...ys),hi=Math.max(...ys),rg=hi-lo||1;
  const X=t=>((t-t0)/(t1-t0))*(W-4)+2,Y=v=>Hh-12-((v-lo)/rg)*(Hh-20);
  const d=h.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[4]).toFixed(1)).join('');
  const e1=X(c.passAt),e2=X(c.passAt+S.delay*60e3);const e=entryOf(c);
  let ticks='';for(let i=1;i<5;i++){const x=X(t0+i*3600e3);ticks+=`<line x1="${x}" x2="${x}" y1="0" y2="${Hh-10}" stroke="var(--line)"/><text x="${x}" y="${Hh-1}" fill="var(--mut)" font-size="9" text-anchor="middle" font-family="monospace">${i}ч</text>`}
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${ticks}
    <rect x="${e1.toFixed(1)}" y="0" width="${Math.max(3,e2-e1).toFixed(1)}" height="${Hh-10}" fill="var(--up)" opacity=".28"/>
    ${e?`<line x1="0" x2="${W}" y1="${Y(e.p0/(1+S.fee/100)).toFixed(1)}" y2="${Y(e.p0/(1+S.fee/100)).toFixed(1)}" stroke="var(--up)" stroke-dasharray="3 3" opacity=".6"/>`:''}
    <path d="${d}" fill="none" stroke="var(--fg)" stroke-width="1.4"/></svg>`}
function overlaySvg(cs){const W=360,Hh=220,M=300;const series=[];
  cs.forEach(c=>{const h=H[c.addr],e=entryOf(c);if(!e)return;series.push(h.pts.filter(p=>p[0]>=e.te&&p[0]<=e.te+M*60e3).map(p=>[(p[0]-e.te)/60000,net(p[4])/e.p0]))});
  if(!series.length)return `<svg viewBox="0 0 ${W} ${Hh}"><text x="${W/2}" y="${Hh/2}" fill="var(--mut)" font-size="11" text-anchor="middle" font-family="monospace">графики подгружаются…</text></svg>`;
  let mx=2;series.forEach(s=>s.forEach(p=>{if(p[1]>mx)mx=p[1]}));mx=Math.min(mx,100);const mn=0.1;
  const X=m=>28+(m/M)*(W-34),Y=v=>{const l=Math.log10(Math.max(mn,Math.min(mx,v)));return 8+(1-(l-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn)))*(Hh-28)};
  let g='';[0.25,0.5,1,2,5,10,20,50].filter(v=>v<=mx).forEach(v=>{g+=`<line x1="28" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===1?'var(--up)':'var(--line)'}" ${v===1?'stroke-dasharray="3 3"':''}/><text x="24" y="${Y(v)+3}" fill="var(--mut)" font-size="9" text-anchor="end" font-family="monospace">×${v}</text>`});
  [60,120,180,240,300].forEach(m=>g+=`<text x="${X(m)}" y="${Hh-4}" fill="var(--mut)" font-size="9" text-anchor="middle" font-family="monospace">${m/60}ч</text>`);
  const lines=series.map(s=>`<path d="${s.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="var(--acc)" stroke-width="1" opacity=".45"/>`).join('');
  let md='';for(let m=0;m<=M;m+=5){const v=series.map(s=>{let b=null;for(const p of s){if(p[0]<=m)b=p;else break}return b&&m-b[0]<10?b[1]:null}).filter(x=>x!=null);if(v.length)md+=(md?'L':'M')+X(m).toFixed(1)+' '+Y(med(v)).toFixed(1)}
  return `<svg viewBox="0 0 ${W} ${Hh}">${g}<rect x="28" y="8" width="4" height="${Hh-28}" fill="var(--up)" opacity=".35"/>${lines}${md?`<path d="${md}" fill="none" stroke="var(--up)" stroke-width="2.4"/>`:''}
    <text x="${W-4}" y="18" fill="var(--up)" font-size="10" text-anchor="end" font-family="monospace">— медиана</text></svg>`}

// вид запуска
function launchType(r){const d=(r.dex||'').toLowerCase(),ps=(r.dexes||[]).join(' ').toLowerCase();
  if(/pump-?swap/.test(d))return r.canon===true?'pump.fun → PumpSwap':r.canon===false?'Пул вручную (PumpSwap)':'PumpSwap';
  if(/dbc|dynamic-bonding/.test(d))return 'Meteora DBC (кривая)';
  if(/launch/.test(d))return 'LaunchLab (кривая)';
  if(/meteora/.test(d))return /dbc|dynamic/.test(ps)?'Meteora DBC → Meteora':'Пул вручную (Meteora)';
  if(/raydium/.test(d))return /launch/.test(ps)?'LaunchLab → Raydium':'Пул вручную (Raydium)';
  return 'Другое ('+(r.dex||'?')+')'}
const isManual=t=>/вручную/.test(t);

// признаки первых 10 минут и итог по минутным свечам [t,o,h,l,c,v]
function featOf(r,k){
  const t0=r.listedAt,m=x=>Math.floor((x[0]-t0)/60000);
  const f10=k.filter(x=>m(x)>=0&&m(x)<10),after=k.filter(x=>m(x)>=10);
  if(!f10.length)return null;
  const p0=f10[0][1]||f10[0][4],p10=f10[f10.length-1][4];
  const v1=f10.filter(x=>m(x)===0).reduce((s,x)=>s+x[5],0),v5=f10.filter(x=>m(x)<5).reduce((s,x)=>s+x[5],0),v510=f10.filter(x=>m(x)>=5).reduce((s,x)=>s+x[5],0);
  let hi=0,dd=0;f10.forEach(x=>{hi=Math.max(hi,x[2]);dd=Math.max(dd,1-x[3]/hi)});
  const green=f10.filter(x=>x[4]>x[1]).length,active=new Set(f10.map(m)).size;
  const f={v1,v5,v510,trend:v5?v510/v5:null,x10:p0?p10/p0:null,dd10:dd*100,green,active,p0,p10};
  // итог: от цены на 10-й минуте
  const last=k[k.length-1];f.peak=after.length&&p10?Math.max(...after.map(x=>x[2]))/p10:null;f.now=p10?last[4]/p10:null;f.lastAt=last[0];
  return f}
function groupOf(r){const f=r.f;if(!f||f.peak==null)return null;if(Date.now()-r.listedAt<2*3600e3)return 'early';
  if(f.peak>=2&&f.now>=1&&Date.now()-f.lastAt<60*60e3)return 'grow';
  if(f.peak>=2)return 'pd';if(f.now<=0.3)return 'rug';return 'dead'}

async function runResearch(){if(resBusy){resStop=true;resMsg='Останавливаю…';renderResearch();return}resBusy=true;resStop=false;renderResearch();
  const now=Date.now(),okAge=x=>now-x.listedAt>=2*3600e3&&now-x.listedAt<=24*3600e3;
  const cand={};
  try{
    // 1. топ сегодняшнего дня (растущие и активные)
    const paths=[...[1,2,3,4,5,6,7,8].map(n=>'/dexes/pumpswap/pools?sort=h24_volume_usd_desc&page='+n),
      ...['meteora-dbc','meteora-damm-v2','raydium-launchlab'].flatMap(d=>[1,2].map(n=>'/dexes/'+d+'/pools?sort=h24_volume_usd_desc&page='+n)),
      '/trending_pools?duration=24h&page=1','/trending_pools?duration=24h&page=2'];
    let pi=0,vol={};
    for(const path of paths){if(resStop)break;pi++;
      resMsg=`Ищу топ монет дня: ${pi} из ${paths.length} · найдено ${Object.keys(cand).length}`;renderResearch();
      try{const r=await gt(path+'&include=base_token,quote_token,dex',1);const inc={};(r.included||[]).forEach(x=>inc[x.id]=x);
        (r.data||[]).forEach(d=>{const p=gtParse(d,inc);if(p&&okAge(p)&&(!cand[p.addr]||p.v24>(cand[p.addr].v24||0)))cand[p.addr]={...p,src:'top'}})}catch{}}
    // 2. все, что видел сканер (в том числе скамы и тихо умершие)
    Object.values(SEEN).filter(okAge).forEach(x=>{if(!cand[x.addr])cand[x.addr]={...x,src:'seen'}});
    // не повторять свежие замеры; монеты старше 16 ч уже не меняются
    let list=Object.values(cand).filter(x=>{const o=RES[x.addr];return !o||(Date.now()-o.at>30*60e3&&Date.now()-o.listedAt<16*3600e3+30*60e3)});
    const tops=list.filter(x=>x.src==='top').sort((a,b)=>(b.v24||0)-(a.v24||0)),rest=list.filter(x=>x.src!=='top').sort(()=>Math.random()-.5);
    list=[...tops,...rest];
    if(!list.length){resMsg=Object.keys(SEEN).length?'Новых монет для замера нет: нужны монеты старше 2 часов. Держи страницу открытой — сканер их копит.':'Сканер ещё не накопил монет. Подожди пару часов с открытой страницей.';return}
    // 3. DEX Screener: время рождения токена, все его пулы, соцсети
    for(let i=0;i<list.length;i+=30){resMsg='Узнаю время рождения монет…';renderResearch();
      try{const ps=await j(`${DS}/tokens/v1/solana/${list.slice(i,i+30).map(x=>x.addr).join(',')}`);
        ps.forEach(p=>{const x=cand[p.baseToken?.address];if(!x)return;x.dexes=[...new Set([...(x.dexes||[]),p.dexId])];
          if(p.pairCreatedAt)x.tokAt=Math.min(x.tokAt||Infinity,p.pairCreatedAt);x.soc=Math.max(x.soc||0,(p.info?.socials||[]).length+(p.info?.websites||[]).length);
          if(!x.img&&p.info?.imageUrl)x.img=p.info.imageUrl})}catch{}}
    // 4. по каждой: настоящий ли пул и первые минуты жизни
    let done=0;
    for(const x of list){if(resStop)break;
      resMsg=`Изучаю монеты: ${done} из ${list.length} · осталось ~${Math.ceil((list.length-done)*13/60)} мин · живая лента на паузе`;renderResearch();
      if(/pump-?swap/i.test(x.dex)&&x.canon==null){try{x.canon=await isCanonical(x.addr,x.pair)}catch(e){if(/base58/.test(e?.message||''))x.canon=false}}
      try{const before=Math.floor(Math.min(Date.now(),x.listedAt+16*3600e3)/1000);
        const r=await gt(`/pools/${x.pair}/ohlcv/minute?aggregate=1&limit=1000&before_timestamp=${before}&currency=usd`,1);
        const k=(r.data?.attributes?.ohlcv_list||[]).map(c=>[c[0]*1000,+c[1],+c[2],+c[3],+c[4],+c[5]]).filter(c=>c[0]>=x.listedAt-60e3).sort((a,b)=>a[0]-b[0]);
        const sup=x.mc&&x.price?x.mc/x.price:null;
        if(!(x.tokAt<x.listedAt-60e3)){try{const tp=await gt(`/tokens/${x.addr}/pools?page=1`,1);
          (tp.data||[]).forEach(d=>{const t=Date.parse(d.attributes?.pool_created_at);if(t)x.tokAt=Math.min(isFinite(x.tokAt)?x.tokAt:Infinity,t);
            const dx=d.relationships?.dex?.data?.id;if(dx)x.dexes=[...new Set([...(x.dexes||[]),dx])]})}catch{}}
        const rec={addr:x.addr,name:x.name,sym:x.sym,img:x.img,pair:x.pair,dex:x.dex,dexes:x.dexes||[],canon:x.canon,listedAt:x.listedAt,
          tokAt:isFinite(x.tokAt)?Math.min(x.tokAt,x.listedAt):null,soc:x.soc||0,src:x.src,at:Date.now(),f:featOf(x,k)};
        rec.type=launchType(rec);rec.migMin=rec.tokAt&&rec.listedAt-rec.tokAt>60e3?(rec.listedAt-rec.tokAt)/60000:(isManual(rec.type)?0:null);
        rec.mcMig=sup&&rec.f?rec.f.p0*sup:null;rec.g=groupOf(rec);RES[rec.addr]=rec;sset('sc_research',RES)}catch{}
      done++;if(tab==='research')renderResearch()}
    resMsg=resStop?`Остановлено: изучено ${done} из ${list.length}. Нажми «Запустить» — продолжит с того же места.`:`Готово: изучено ${done} монет. Позже нажми ещё раз — добавятся новые.`;
  }finally{resBusy=false;resStop=false;renderResearch()}}

/* ---------- статистика ---------- */
const medN=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2};
const qt=(a,p)=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;return v[Math.min(v.length-1,Math.floor(p*(v.length-1)+.5))]};
function wilson(k,n){if(!n)return null;const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h)*100,Math.min(1,c+h)*100]}
// сравнение признака у живых и мёртвых: для да/нет — доли, для чисел — медианы и «разброс» (25–75%)
function cmpFeat(key,L,D){const f=FK[key];const lv=L.map(r=>r.F[key]).filter(v=>v!=null),dv=D.map(r=>r.F[key]).filter(v=>v!=null);
  if(f[3]==='b'){const pl=lv.length?lv.filter(Boolean).length/lv.length*100:null,pd=dv.length?dv.filter(Boolean).length/dv.length*100:null;
    const common=pl!=null&&(pl>=85||pl<=15);const diff=pl!=null&&pd!=null?Math.abs(pl-pd):null;
    return{key,nL:lv.length,nD:dv.length,L:pl,Dv:pd,common,score:diff==null?0:diff/100,t:v=>v==null?'—':Math.round(v)+'% да'}}
  const ml=medN(lv),md=medN(dv),l25=qt(lv,.25),l75=qt(lv,.75);
  // «общий» признак: у живых узкий разброс относительно всех значений; «отличие»: доля живых выше порога, где мёртвых меньше половины
  const all=[...lv,...dv];const spread=l25!=null&&l75!=null&&qt(all,.9)!=null&&qt(all,.1)!=null&&(qt(all,.9)-qt(all,.1))>0?(l75-l25)/(qt(all,.9)-qt(all,.1)):null;
  let score=0;if(ml!=null&&md!=null&&lv.length>=3&&dv.length>=3){const thr=(ml+md)/2,hi=ml>md;
    const pl=lv.filter(v=>hi?v>=thr:v<=thr).length/lv.length,pd=dv.filter(v=>hi?v>=thr:v<=thr).length/dv.length;score=Math.max(0,pl-pd)}
  return{key,nL:lv.length,nD:dv.length,L:ml,Dv:md,L25:l25,L75:l75,common:spread!=null&&spread<=0.35,score,t:v=>fmtF(key,v)}}

function spark(pts,entry,T,G,w=300,h=70){if(!pts||pts.length<2||!entry)return '';const end=T+G.win*60e3;const P=pts.filter(x=>x[0]<=end);if(P.length<2)return '';
  const xs=P.map(x=>x[0]),x0=xs[0],x1=Math.max(xs[xs.length-1],x0+1);const ys=P.map(x=>Math.max(0.01,x[4]/entry));const lo=Math.min(1-G.dn/100,...ys)*0.97,hi=Math.max(1+G.up/100,...ys)*1.03;
  const X=t=>((t-x0)/(x1-x0)*w).toFixed(1),Y=v=>(h-(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*h).toFixed(1);
  const d=P.map((x,i)=>(i?'L':'M')+X(x[0])+' '+Y(Math.max(0.01,x[4]/entry))).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${Y(1)}" y2="${Y(1)}" stroke="#7d8796" stroke-dasharray="3 3" stroke-width="1"/>

function fullChart(c,r,G=GOAL,w=340,h=150){const P=[];

  const lastK=P.length?Math.max(...P.map(x=>x[0])):0;for(const d of c.ds||[])if(d[1]&&d[0]*1000>lastK)P.push([d[0]*1000,d[2]!=null&&d[2]<200?1e-12:d[1]]);
  P.sort((a,b)=>a[0]-b[0]);if(P.length<2)return '<p class="mut" style="font-size:12px">Данных о цене пока мало.</p>';
  const ref=r.entry||P[0][1],end=r.T+G.win*60e3,Q=P.filter(x=>x[0]<=end+30*60e3);const x0=c.t,x1=Math.max(Q[Q.length-1][0],r.T+60e3);

  const d=Q.map((x,i)=>(i?'L':'M')+X(x[0])+' '+Y(Math.max(0.01,x[1]/ref))).join(' ');const tm=ms=>new Date(ms+5*3600e3).toISOString().slice(11,16);

    <text x="${w-2}" y="${h+12}" fill="#7d8796" font-size="10" font-family="monospace" text-anchor="end">${tm(x1)}</text></svg>`}

const fmtLeft=t=>{const s=Math.max(0,Math.round((t-Date.now())/1000));return s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'закрыто'};
setInterval(()=>{let gone=false;document.querySelectorAll('[data-left]').forEach(e=>{e.textContent=fmtLeft(+e.dataset.left);if(+e.dataset.left<Date.now())gone=true});if(gone&&tab==='pass')renderPass()},1000);

/* «История»: цена ×1 — на КОНЕЦ окна принятия решения, затем 5 часов.
   Для фиксации базы используются только закрытые свечи и снимки не позже этого момента.
   Если нет свежего наблюдения (<= 2 мин), результат остаётся неизвестным. */
const HW=300,H_OFF=[15,30,60,120,180,300],H_TGT=[1.5,2,3,5];
function historyAnchor(r){const cut=r.T+BUY.win*60e3,c=r.c,pts=[];
  for(const d of c.ds||[])if(d[1]>0&&d[0]*1000<=cut)pts.push([d[0]*1000,d[1]]);
  for(const x of [...(c.k10?.c||[]),...(c.path?.c||[])])
    if(x[4]>0&&x[0]*1000+60e3<=cut)pts.push([x[0]*1000+60e3,x[4]]);
  pts.sort((a,b)=>b[0]-a[0]);
  if(!pts.length||cut-pts[0][0]>120e3)return null;
  return{cut,price:pts[0][1],at:pts[0][0]}}
function hPath(r){const base=historyAnchor(r);if(!base)return null;
  const pts=pathAfter(r.c,base.cut,{...GOAL,win:HW}).pts.filter(x=>x[0]>=base.cut&&x[0]<=base.cut+HW*60e3);
  if(!pts.length)return null;
  const k=(1-BUY.fee/100)/(1+BUY.fee/100);
  return [[0,k,k,k],...pts.map(x=>[(x[0]-base.cut)/60000,Math.max(1e-6,Math.max(x[1],x[4])/base.price*k),Math.max(1e-6,Math.min(x[1],x[4])/base.price*k),Math.max(1e-6,x[4]/base.price*k)])]}
function historyComplete(o,now){const base=historyAnchor(o.r);
  return !!base&&base.cut+HW*60e3<=now&&o.s?.[o.s.length-1]?.[0]>=HW-15}
function hAt(s,m){if(!s)return null;let b=null;for(const p of s){if(p[0]<=m)b=p;else break}return b&&m-b[0]<12&&s[s.length-1][0]>=m-5?b[3]:null}
function hStats(s){if(!s||!s.length)return null;let pk=0,pkM=0,lo=Infinity;const hit={};for(const p of s){if(p[1]>pk){pk=p[1];pkM=p[0]}lo=Math.min(lo,p[2]);for(const x of H_TGT)if(hit[x]==null&&p[1]>=x)hit[x]=p[0]}
  return{pk,pkM,dd:lo<1?(1-lo)*100:0,hit}}
function overlay(series){const W=360,Hh=220,M=HW;if(!series.length)return '<p class="mut" style="font-size:12px">Пока нет монет с графиком.</p>';
  let mx=2;series.forEach(s=>s.forEach(p=>{if(p[3]>mx)mx=p[3]}));mx=Math.min(mx,100);const mn=0.1;
  const X=m=>28+(m/M)*(W-34),Y=v=>{const l=Math.log10(Math.max(mn,Math.min(mx,v)));return 8+(1-(l-Math.log10(mn))/(Math.log10(mx)-Math.log10(mn)))*(Hh-28)};
  let g='';[0.25,0.5,1,2,5,10,20,50].filter(v=>v<=mx).forEach(v=>{g+=`<line x1="28" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===1?'#22d17b':'#222a35'}" ${v===1?'stroke-dasharray="3 3"':''}/><text x="24" y="${Y(v)+3}" fill="#7d8796" font-size="9" text-anchor="end" font-family="monospace">×${v}</text>`});
  [60,120,180,240,300].forEach(m=>g+=`<text x="${X(m)}" y="${Hh-4}" fill="#7d8796" font-size="9" text-anchor="middle" font-family="monospace">${m/60}ч</text>`);
  const lines=series.slice(0,150).map(s=>`<path d="${s.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[3]).toFixed(1)).join('')}" fill="none" stroke="#5b8cff" stroke-width="1" opacity=".4"/>`).join('');
  let md='';for(let m=0;m<=M;m+=5){const v=series.map(s=>hAt(s,m)).filter(x=>x!=null);if(v.length>=2)md+=(md?'L':'M')+X(m).toFixed(1)+' '+Y(medN(v)).toFixed(1)}
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;display:block;margin-top:6px">${g}${lines}${md?`<path d="${md}" fill="none" stroke="#22d17b" stroke-width="2.4"/>`:''}
    <text x="${W-4}" y="18" fill="#22d17b" font-size="10" text-anchor="end" font-family="monospace">— медиана</text></svg>`}
function coinChart5h(r){const base=historyAnchor(r);if(!base)return '<p class="mut" style="font-size:11px">Цена в конце окна решения неизвестна</p>';
  const c=r.c,W=360,Hh=90,t0=c.t,t1=base.cut+HW*60e3,P=[];
  for(const x of c.k10?.c||[])P.push([x[0]*1000,x[4]]);for(const x of c.path?.c||[])P.push([x[0]*1000,x[4]]);const lk=P.length?Math.max(...P.map(x=>x[0])):0;
  for(const d of c.ds||[])if(d[1]&&d[0]*1000>lk)P.push([d[0]*1000,d[2]!=null&&d[2]<200?null:d[1]]);
  const Q=P.filter(x=>x[1]&&x[0]<=t1).sort((a,b)=>a[0]-b[0]);if(Q.length<2)return '<p class="mut" style="font-size:11px">мало данных для графика</p>';
  const ys=[Math.log(base.price),...Q.map(x=>Math.log(x[1]))],lo=Math.min(...ys),hi=Math.max(...ys),rg=hi-lo||1;
  const X=t=>((t-t0)/(t1-t0))*(W-4)+2,Y=v=>Hh-12-((Math.log(v)-lo)/rg)*(Hh-20);
  const d=Q.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');const e1=X(r.T),e2=X(base.cut);
  let ticks='';for(let i=1;i<=5;i++){const x=X(base.cut+i*3600e3);if(x<W)ticks+=`<line x1="${x}" x2="${x}" y1="0" y2="${Hh-10}" stroke="#222a35"/><text x="${x}" y="${Hh-1}" fill="#7d8796" font-size="9" text-anchor="middle" font-family="monospace">${i}ч</text>`}
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" style="width:100%;height:90px;display:block;margin-top:4px">${ticks}
    <rect x="${e1.toFixed(1)}" y="0" width="${Math.max(3,e2-e1).toFixed(1)}" height="${Hh-10}" fill="#22d17b" opacity=".28"/>
    <line x1="0" x2="${W}" y1="${Y(base.price).toFixed(1)}" y2="${Y(base.price).toFixed(1)}" stroke="#22d17b" stroke-dasharray="3 3" opacity=".6"/>
    <path d="${d}" fill="none" stroke="#e6e9ee" stroke-width="1.4"/></svg>`}
let HDAY=0,HMODE=LS.get('lab_hmode','replay');
/* Второй уровень: сравнивать только монеты, прошедшие первый фильтр.
   Признаки берутся на момент сигнала; сильная/слабая определяется позже. */
let H2=Object.assign({minutes:45,target:1},LS.get('lab_h2',{}));
function secondLevel(rows,now){
  const yes=[],no=[];
  for(const o of rows){
    if(now<o.r.T+BUY.win*60e3+H2.minutes*60e3)continue;
    const x=hAt(o.s,H2.minutes);
    if(x==null)continue;
    (x>=H2.target?yes:no).push(o.r)
  }
  const diffs=yes.length>=5&&no.length>=5
    ?FEATS.map(f=>cmpFeat(f[0],yes,no))
      .filter(x=>x.nL>=5&&x.nD>=5&&x.score>=0.3)
      .sort((a,b)=>b.score-a.score)
    :[];
  return {yes,no,diffs}
}
function makeSecondLevel(base,report,G){
  if(!report.diffs.length)return;
  const added=report.diffs.slice(0,3).map(x=>{
    const meta=FK[x.key];
    if(meta[3]==='b')return[x.key,'=',x.L>=50];
    const greater=x.L>x.Dv;
    const threshold=qt(report.yes.map(r=>r.F[x.key]),greater?0.2:0.8);
    return[x.key,greater?'>=':'<=',+Number(threshold).toPrecision(3)]
  }).filter(x=>!base.rules.some(r=>r[0]===x[0]));
  if(!added.length){alert('Эти признаки уже есть в выбранном фильтре.');return}
  FILTERS.unshift({id:'f'+Date.now(),name:('Уровень 2 · '+base.name).slice(0,40),created:Date.now(),frozen:null,
    rules:[...base.rules.map(r=>[...r]),...added],goal:{...G}});
  SEL=FILTERS[0].id;saveF();switchTab('rules')
}
function renderHistory(){const box=$('#hist');if(!box)return;const f=curF();const D=LAB.days[almatyDay(HDAY)];
  if(!D){box.innerHTML='<div class="empty">Загружаю данные…</div>';loadDay(HDAY).then(renderHistory);return}
  const G=f.goal||GOAL,now=Date.now();
  const all=dayRows(D,G).filter(r=>r.T<=now&&r.st!=='late'&&r.st!=='legacy'&&r.entry);
  let cs,fs;
  if(HMODE==='jour'){const J=JOUR.filter(j=>almatyDay(0)&&new Date(j.t+5*3600e3).toISOString().slice(0,10)===D.d);const by={};all.forEach(r=>by[r.c.a]=r);
    cs=[];J.forEach(j=>{const r0=by[j.a];if(r0)cs.push({...r0,J:j})});cs.sort((a,b)=>b.T-a.T);const inJ=new Set(J.map(j=>j.a));fs=all.filter(r=>!inJ.has(r.c.a))}
  else{cs=all.filter(r=>passes(r.F,f.rules)).sort((a,b)=>b.T-a.T);fs=all.filter(r=>!passes(r.F,f.rules))}
  // сравнение всех фильтров на этом дне
  // 30 мин и 1 ч — по одним и тем же монетам (есть данные на обе отметки); ×1,5 — только монеты, у которых 5 ч уже прошли
  const cmpRows=FILTERS.map(x=>{const rr=dayRows(D,x.goal||GOAL).filter(r=>r.T<=now&&r.st!=='late'&&r.st!=='legacy'&&r.entry&&passes(r.F,x.rules)).map(r=>({r,s:hPath(r)})).filter(o=>o.s);
    const both=rr.map(o=>[hAt(o.s,30),hAt(o.s,60)]).filter(v=>v[0]!=null&&v[1]!=null);const fin=rr.filter(o=>historyComplete(o,now));
    const v30=both.map(v=>v[0]),v60=both.map(v=>v[1]),hit=fin.filter(o=>o.s.some(p=>p[1]>=1.5)).length;
    return `<tr${x.id===SEL?' style="background:rgba(91,140,255,.08)"':''}><td><i class="fdot" style="--fc:${fColor(x)}"></i>${esc(x.name)}</td><td>${rr.length}</td><td class="${(medN(v30)||0)>=1?'up':'dn'}">${xf(medN(v30))}</td><td class="${(medN(v60)||0)>=1?'up':'dn'}">${xf(medN(v60))}</td><td>${v60.length?Math.round(v60.filter(v=>v>=1).length/v60.length*100)+'%':'—'}</td><td class="mut">${both.length}</td><td>${fin.length?Math.round(hit/fin.length*100)+'%':'—'}</td><td class="mut">${fin.length}</td></tr>`}).join('');
  const ps=cs.map(r=>({r,s:hPath(r)})).filter(x=>x.s),pf=fs.map(r=>({r,s:hPath(r)})).filter(x=>x.s);
  const stage2=HMODE==='replay'?secondLevel(ps,now):null;
  const stage2html=stage2?`<div class="agg">
    <h3>Второй уровень · сильные против слабых среди прошедших</h3>
    <div class="chips"><label>Через <select id="s2minutes">${[15,30,45,60,120].map(n=>`<option value="${n}"${H2.minutes===n?' selected':''}>${n} мин</option>`).join('')}</select></label>
    <label>Сильная от <select id="s2target">${[1,1.5,2].map(n=>`<option value="${n}"${H2.target===n?' selected':''}>×${n}</option>`).join('')}</select></label></div>
    <p class="mut">Сильных: <b class="up">${stage2.yes.length}</b> · слабых: <b class="dn">${stage2.no.length}</b>. Только монеты, для которых уже наступила отметка и есть цена.</p>
    ${stage2.diffs.length?`<div class="tbl"><table><tr><th>Признак на момент вердикта</th><th>Сильные</th><th>Слабые</th><th>n</th></tr>
      ${stage2.diffs.slice(0,8).map(x=>`<tr><td>${esc(FK[x.key][1])}</td><td class="up">${x.t(x.L)}</td><td class="dn">${x.t(x.Dv)}</td><td>${x.nL}/${x.nD}</td></tr>`).join('')}</table></div>
      <button class="btn" id="s2make" style="width:100%">Создать отдельный фильтр второго уровня</button>`
      :'<p class="mut">Пока нет достаточно подтверждённых различий: нужно не меньше 5 сильных, 5 слабых и отличающиеся ранние признаки.</p>'}
    <p class="mut" style="font-size:11px">Это анализ уже известных результатов. Новый фильтр необходимо проверить на будущих днях; доходность не гарантируется.</p>
  </div>`:''; 
  const col=v=>v==null?'':v>=1?'up':'dn',plus=a=>a.length?Math.round(a.filter(x=>x>=1).length/a.length*100)+'%':'—';
  let rows='';for(const m of H_OFF){const v=ps.map(x=>hAt(x.s,m)).filter(x=>x!=null),w=pf.map(x=>hAt(x.s,m)).filter(x=>x!=null);
    rows+=`<tr><td>через ${dur(m)}</td><td class="${col(medN(v))}">${xf(medN(v))}</td><td>${plus(v)}</td><td class="${col(medN(w))}">${xf(medN(w))}</td><td>${plus(w)}</td><td class="mut">${v.length}/${w.length}</td></tr>`}
  const SA=ps.filter(x=>historyComplete(x,now)).map(x=>hStats(x.s)),SB=pf.filter(x=>historyComplete(x,now)).map(x=>hStats(x.s));
  const hr=(arr,x)=>{const t=arr.map(p=>p.hit[x]).filter(v=>v!=null);return arr.length?Math.round(t.length/arr.length*100)+'%'+(t.length?' · ~'+dur(medN(t)):''):'—'};
  let hrows='';H_TGT.forEach(x=>{hrows+=`<tr><td>дошли до ×${x}</td><td>${hr(SA,x)}</td><td>${hr(SB,x)}</td></tr>`});
  hrows+=`<tr><td>пик (медиана)</td><td class="up">${xf(medN(SA.map(p=>p.pk)))}</td><td>${xf(medN(SB.map(p=>p.pk)))}</td></tr>`;
  hrows+=`<tr><td>просадка (медиана)</td><td class="dn">${SA.length?'−'+Math.round(medN(SA.map(p=>p.dd)))+'%':'—'}</td><td class="dn">${SB.length?'−'+Math.round(medN(SB.map(p=>p.dd)))+'%':'—'}</td></tr>`;
  const exact=ps.filter(x=>pathAfter(x.r.c,historyAnchor(x.r).cut,{...G,win:HW}).exact).length;
  box.innerHTML=`<div class="chips" style="padding-top:6px">${[0,1,2,3,4,5,6].map(o=>`<button class="chip${HDAY===o?' on':''}" data-hd="${o}">${o===0?'Сегодня':o===1?'Вчера':almatyDay(o).slice(5)}</button>`).join('')}</div>
    <div class="seg"><button class="${HMODE==='replay'?'on':''}" data-hm="replay">Переигровка по фильтру</button><button class="${HMODE==='jour'?'on':''}" data-hm="jour">Что реально было в «Прошли»</button></div>
    ${HMODE==='replay'?fChips():'<p class="mut" style="font-size:12px;margin:6px 0 0">Сигналы, которые этот телефон показал в «Прошли», с тем фильтром, который тогда стоял. Пока сайт закрыт, журнал не пишется.</p>'}
    <details class="addc" style="margin-top:6px"><summary>Сравнить все фильтры на этом дне</summary><div class="tbl"><table><tr><th>Фильтр</th><th>сигн.</th><th>30м</th><th>1ч</th><th>в плюсе 1ч</th><th>n</th><th>×1.5 за 5ч</th><th>n</th></tr>${cmpRows}</table></div><p class="mut" style="font-size:11px;margin:4px 0 0">30м и 1ч — по одним и тем же монетам (n). ×1.5 — только монеты, у которых 5 часов уже прошли (n).</p></details>
    <p class="mut" style="font-size:11px;margin:4px 0 0;font-family:var(--mono)">${HMODE==='replay'?'фильтр «'+esc(f.name)+'»':'журнал'} · покупка на ${G.dec}-й мин · комиссия + проскальзывание ${BUY.fee}% на вход и выход <button class="chip" id="hFee" style="padding:2px 8px">изменить</button></p>
    <div class="agg big"><h3>Прошли (${cs.length}) против не прошли (${fs.length})</h3>
    <p class="mut" style="margin:0;font-size:12px">5 часов после окна решения. Линия ×1 — цена в конце окна; множители учитывают комиссии. Для фильтра используются только данные на момент вердикта.</p>
    ${overlay(ps.map(x=>x.s))}
    <div class="tbl"><table><tr><th>После покупки</th><th>прошли</th><th>в плюсе</th><th>не прошли</th><th>в плюсе</th><th>n</th></tr>${rows}</table></div>
    <div class="tbl"><table><tr><th>За 5 ч (завершено: ${SA.length}/${SB.length})</th><th>прошли</th><th>не прошли</th></tr>${hrows}</table></div>
    <p class="mut" style="font-size:11px;margin:6px 0 0">Если «прошли» не лучше «не прошли» — фильтр не работает. Точный минутный график у ${exact} из ${ps.length}, остальные — по снимкам цены. Подбор на известном дне — не доказательство.</p></div>
    ${stage2html}
    <div class="sec-h">Прошедшие · 5 ч после окна решения · зелёная полоса — окно решения · линия ×1 — цена в конце окна</div>
    ${ps.map(({r,s})=>{const c=r.c,st=hStats(s),nowX=s[s.length-1][3];
      return `<div class="hcard" data-a="${esc(c.a)}" style="border-left:3px solid ${r.J?r.J.fcol:fColor(f)}"><div class="hh">${avHtml({img:c.i,sym:c.s})}<div class="mid" style="flex:1;min-width:0"><div class="nm">${esc(c.n||'')}<span>${esc(c.s||'')}</span></div>
      ${r.J?`<div class="l2"><i class="fdot" style="--fc:${r.J.fcol}"></i>${esc(r.J.fname)}${FILTERS.find(x=>x.id===r.J.fid&&fprintSync(x)===r.J.fp)?'':' <span class="warn">(фильтр потом изменён: '+esc(r.J.rules)+')</span>'}</div>`:''}
      <div class="l2">пик <span class="up">${xf(st.pk)}</span> через ${dur(st.pkM)} · просадка <span class="dn">−${Math.round(st.dd)}%</span> · ${s[s.length-1][0]>=HW-5?'через 5 ч':'сейчас'} <span class="${nowX>=1?'up':'dn'}">${xf(nowX)}</span></div></div></div>
      ${coinChart5h(r)}</div>`}).join('')||'<div class="empty">В этот день фильтр никого не выбрал.</div>'}`;
  box.querySelectorAll('[data-hd]').forEach(b=>b.onclick=async()=>{HDAY=+b.dataset.hd;await loadDay(HDAY);renderHistory()});
  box.querySelectorAll('[data-hm]').forEach(b=>b.onclick=()=>{HMODE=b.dataset.hm;LS.set('lab_hmode',HMODE);renderHistory()});bindFChips(box,renderHistory);
  box.querySelectorAll('.hcard').forEach(el=>el.onclick=()=>coinSheet(D,el.dataset.a));
  $('#hFee').onclick=()=>{const v=prompt('Комиссия + проскальзывание, % на вход и на выход',BUY.fee);if(v!=null&&+v>=0){BUY.fee=Math.min(20,+v);saveBuy();renderHistory()}};
  for(const [id,k] of [['s2minutes','minutes'],['s2target','target']]){
    const el=$('#'+id);if(el)el.onchange=()=>{H2[k]=+el.value;LS.set('lab_h2',H2);renderHistory()}}
  if($('#s2make'))$('#s2make').onclick=()=>makeSecondLevel(f,stage2,G)}

/* ---------- «Авто»: что сервер сам нашёл (считает каждый час без телефона) ---------- */
let AREP=null,AREPat=0;
async function renderAuto(){const box=$('#auto');if(!box)return;
  if(!AREP||Date.now()-AREPat>10*60e3){box.innerHTML='<div class="empty">Загружаю отчёт сервера…</div>';try{AREP=await getJ('research/report.json');AREPat=Date.now()}catch{}}
  const R=AREP;if(!R){box.innerHTML='<div class="empty">Сервер ещё не сделал первый отчёт. Он считает раз в час.</div>';return}
  const G=R.cfg,lab=k=>FK[k]?FK[k][1]:k,pc=v=>v==null?'—':Math.round(v*100)+'%',lf=v=>v==null?'—':'×'+v.toFixed(2);
  const st=R.feats.filter(f=>f.stable),tested=R.feats.filter(f=>!f.stable&&f.days>0);
  const autoBox=R.auto.map(a=>`<div class="rule"><div class="rh"><h3>Автофильтр: ${a.k} ${a.k===1?'признак':'признака'}</h3></div>
      ${a.rulesNow?`<p>${a.rulesNow.map(r=>esc(ruleTxt(r))).join('<br>')}</p>`:'<p class="mut">Пока нет подходящих признаков.</p>'}
      <p class="why">Проверка вперёд (правило с прошлых дней → следующий день): ${a.n?`${a.n} монет, живых ${pc(a.rate)}, это ${lf(a.lift)} к случайному выбору`:'ещё не на чем проверить'} · дней: ${a.days.length}</p>
      ${a.days.length?`<div class="tbl"><table><tr><th>День</th><th>сигн.</th><th>живых</th><th>база</th><th>1ч (медиана)</th></tr>${a.days.slice(-7).map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.sig}</td><td>${x.n?Math.round(x.live/x.n*100)+'%':'—'}</td><td>${pc(x.base)}</td><td>${xf(x.x60)}</td></tr>`).join('')}</table></div>`:''}
      ${a.rulesNow?`<button class="chip" data-add="${a.k}" style="margin-top:6px">+ В мои фильтры</button>`:''}</div>`).join('');
  box.innerHTML=`<div class="agg"><h3 style="margin:0">Сервер исследует сам</h3>
    <p class="mut" style="font-size:12px;margin:4px 0 0">Каждый час, без телефона. Живая: +${G.up}% за ${dur(G.win)}, стоп −${G.dn}%, вход на ${G.dec}-й мин. Поменять определение — скажи Claude.</p>
    <p class="mut" style="font-size:11px;margin:4px 0 0;font-family:var(--mono)">отчёт ${ago(R.updated)} назад · дней с данными: ${R.days.length} · дней с итогами: ${R.labeledDays}</p>
    <div class="tbl"><table><tr><th>День</th><th>монет</th><th class="up">живые</th><th class="dn">мёртвые</th><th>неясно</th><th>% живых</th></tr>${R.days.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.all}</td><td class="up">${x.live}</td><td class="dn">${x.dead}</td><td>${x.amb}</td><td>${pc(x.base)}</td></tr>`).join('')}</table></div>
    ${R.labeledDays<4?`<p class="warn" style="font-size:12px;margin:6px 0 0">Для честной проверки нужно хотя бы 4 дня с итогами (сейчас ${R.labeledDays}). До этого всё ниже — предварительно.</p>`:''}</div>
  <div class="sec-h">Устойчивые признаки (работают день за днём)</div>
  ${st.length?st.map(f=>`<div class="rule"><div class="rh"><h3>${esc(lab(f.k))}</h3></div><p>${f.cur?esc(ruleTxt(f.cur.rule)):''}</p>
    <p class="why">на следующих днях: живых ${pc(f.rate)} (${lf(f.lift)} к случайному) · лучше случайного в ${f.daysUp} из ${f.days} дней · монет ${f.n}</p></div>`).join(''):'<div class="empty" style="padding:12px">Пока не найдено. Нужно больше дней.</div>'}
  <div class="sec-h">Автофильтры</div>${autoBox}
  <details class="addc"><summary>Проверенные, но неустойчивые признаки (${tested.length})</summary>
    <div class="tbl"><table><tr><th>Признак</th><th>дней</th><th>лучше</th><th>к случ.</th><th>n</th></tr>${tested.map(f=>`<tr><td>${esc(lab(f.k))}</td><td>${f.days}</td><td>${f.daysUp}</td><td>${lf(f.lift)}</td><td>${f.n}</td></tr>`).join('')}</table></div></details>
  <details class="addc"><summary>Подбор на последних днях — ещё не проверено (${R.inSample.length})</summary>
    <p class="mut" style="font-size:12px">Это то, что лучше всего выглядит на последних 3 днях. Может оказаться совпадением — смотри «Устойчивые».</p>
    <div class="tbl"><table><tr><th>Правило</th><th>к случ.</th><th>живых</th><th>n</th></tr>${R.inSample.map(x=>`<tr><td>${esc(ruleTxt(x.rule))}</td><td>${lf(x.lift)}</td><td>${pc(x.rate)}</td><td>${x.n}</td></tr>`).join('')}</table></div></details>`;
  box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const a=R.auto.find(x=>x.k===+b.dataset.add);if(!a?.rulesNow)return;
    const f={id:'f'+Date.now(),name:'Авто '+a.k+' · '+new Date(R.updated+5*3600e3).toISOString().slice(5,10),created:Date.now(),frozen:null,rules:a.rulesNow.map(r=>[...r]),goal:{...G}};
    FILTERS.unshift(f);SEL=f.id;saveF();alert('Добавлен фильтр «'+f.name+'». Он выбран в «Прошли» и «Истории».')})}

/* ---------- общее ---------- */
function openSheetHtml(html){openSheet(html)}
function labRender(){if(tab==='auto')renderAuto();if(tab==='research')renderLab();if(tab==='rules')renderFilters();if(tab==='pass')renderPass();if(tab==='hist')renderHistory()}
function switchTab(t){const b=document.querySelector(`.tab[data-t="${t}"]`);if(b)b.click()}
// обновление: сегодня — раз в 2 минуты, живая лента — раз в 30 секунд
setInterval(async()=>{await loadLive();try{journalAdd(buyable(),curF())}catch{}if(document.hidden)return;if(tab==='pass')renderPass();else updPassCount()},30000);
setInterval(async()=>{if(document.hidden)return;await loadDay(0,true);labRender()},120000);
loadDay(0).then(()=>{loadLive().then(updPassCount)});

Object.values(C).forEach(setCanon);evalAll();render();boot();rcLoop();rpcLoop();microLoop();setTimeout(pollDS,4000);

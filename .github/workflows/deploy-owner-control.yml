name: deploy-owner-control
# Manual only. Never publish owner configuration API before review.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/421351476653/locations/global/workloadIdentityPools/github/providers/github
          service_account: helper-ai@sol-scan-511718.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy restricted configuration gateway
        run: |
          set -euo pipefail
          # A 256-bit random owner key must exist OUTSIDE this repository.
          # Secret Manager stores only its SHA-256 hex digest.
          gcloud run deploy solscan-control \
            --source server \
            --project sol-scan-511718 \
            --region us-central1 \
            --platform managed \
            --service-account helper-ai@sol-scan-511718.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --ingress all \
            --max-instances 2 \
            --min-instances 0 \
            --memory 256Mi \
            --concurrency 10 \
            --set-env-vars "SOLSCAN_CONTROL_ORIGIN=https://bakit97.github.io,SOLSCAN_BUCKET=sol-scan-511718-data" \
            --update-secrets "SOLSCAN_CONTROL_SHA256=solscan-control-key-sha256:latest" \
            --quiet
      - name: Publish endpoint discovery only after successful deployment
        run: |
          set -euo pipefail
          url=$(gcloud run services describe solscan-control \
            --project sol-scan-511718 --region us-central1 --format='value(status.url)')
          test -n "$url"
          echo "$url" | grep -Eq '^https://[a-zA-Z0-9-]+[.]run[.]app$'
          printf '{"enabled":true,"url":"%s"}\n' "$url" > /tmp/solscan-control-endpoint.json
          gcloud storage cp /tmp/solscan-control-endpoint.json \
            gs://sol-scan-511718-data/control/endpoint.json

name: real-research-data-audit
on:
  push:
    branches: ['feature/research-live-audit-*']
    paths:
      - 'tests/research-live-audit.mjs'
      - '.github/workflows/real-research-data-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live server research and polygon bank
        run: node tests/research-live-audit.mjs

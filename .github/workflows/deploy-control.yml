name: deploy-control
on:
  push:
    branches: [main]
    paths: ['server/control-api.js', 'server/research-config.js', 'server/pass-runtime.js', 'server/research-runtime.js', 'server/research-two-runtime.js', 'server/research-v2.js', 'server/Dockerfile', '.github/workflows/deploy-control.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: deploy-control
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/421351476653/locations/global/workloadIdentityPools/github/providers/github
          service_account: helper-ai@sol-scan-511718.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy control service (keeps existing env vars)
        run: gcloud run deploy solscan-control --source server --region us-central1 --project sol-scan-511718 --quiet

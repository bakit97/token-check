name: production-v2-readonly-audit
on:
  push:
    branches: [main]
    paths:
      - 'tests/production-v2-audit.mjs'
      - '.github/workflows/production-v2-readonly-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production source, Passed and two independent studies
        run: node tests/production-v2-audit.mjs

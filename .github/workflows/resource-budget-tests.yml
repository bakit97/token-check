name: resource-budget-tests
on:
  push:
    branches: [feature/serverside-passed-r2-20261017]
    paths: ['server/**', 'tests/**', '.github/workflows/resource-budget-tests.yml']
  pull_request:
    paths: ['server/**', 'tests/**', '.github/workflows/resource-budget-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          for file in server/*.js; do node --check "$file"; done
          node --check v2.js
          node --check lab-core.js
      - name: Offline tests; no cloud credentials or deployment
        run: node --test server/*.test.js tests/resource-collector-smoke.cjs tests/source-collector-smoke.cjs tests/research-collector-smoke.cjs tests/v2-smoke.cjs

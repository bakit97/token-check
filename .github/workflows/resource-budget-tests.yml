name: resource-budget-tests
on:
  push:
    branches: [feature/serverside-passed-r2-20261017]
    paths: ['server/**', 'tests/**', 'deployment/**', '.github/workflows/resource-budget-tests.yml']
  pull_request:
    paths: ['server/**', 'tests/**', 'deployment/**', '.github/workflows/resource-budget-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          for file in server/*.js; do node --check "$file"; done
          node --check v2.js
          node --check lab-core.js
      - name: Offline tests; no cloud credentials or deployment
        run: node --test server/*.test.js tests/resource-collector-smoke.cjs tests/source-collector-smoke.cjs tests/research-collector-smoke.cjs tests/v2-smoke.cjs tests/upload-queue-recovery.cjs tests/migration-ws-budget.cjs tests/pool-observation-budget.cjs tests/migration-restart-budget.cjs tests/migration-queue-age.cjs tests/early-age-proof.cjs tests/fresh-migration-proof.cjs tests/stream-upload-recovery.cjs tests/observation-contract-collector.cjs tests/completed-coins-collector.cjs
      - name: Reproduce and verify the production recovery build
        run: |
          python3 deployment/build-recovery.py
          for file in work/recovery-build/server/*.js; do node --check "$file"; done
          SOLSCAN_TEST_COLLECTOR="$PWD/work/recovery-build/server/collector.js" node --test server/resource-budget.test.js tests/resource-collector-smoke.cjs tests/upload-queue-recovery.cjs tests/migration-ws-budget.cjs tests/pool-observation-budget.cjs tests/migration-restart-budget.cjs tests/migration-queue-age.cjs tests/early-age-proof.cjs tests/fresh-migration-proof.cjs tests/stream-upload-recovery.cjs tests/observation-contract-collector.cjs tests/completed-coins-collector.cjs
      - name: Large snapshot streaming memory regression
        run: |
          node --max-old-space-size=128 tests/memory-stream-acceptance.cjs
          node tests/packed-memory-acceptance.cjs

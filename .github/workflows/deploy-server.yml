name: deploy-server
on:
  push:
    branches: [main]
    paths: ['server/**', 'deployment/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify canonical source, contracts and publication plan
        run: |
          for file in server/*.js; do node --check "$file"; done
          python3 deployment/build-recovery.py
          python3 deployment/test-publish-runtime.py
          node --test tests/*.cjs
          node --test server/*.test.js tests/resource-collector-smoke.cjs tests/research-collector-smoke.cjs tests/completed-coins-collector.cjs tests/observation-contract-collector.cjs
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/421351476653/locations/global/workloadIdentityPools/github/providers/github
          service_account: helper-ai@sol-scan-511718.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish changed modules before collector
        run: python3 deployment/publish-runtime.py --bucket sol-scan-511718-data --result runtime-result.json
      - name: Read sanitized startup fault counts
        run: python3 deployment/inspect-runtime-startup.py
      - name: Verify deployed health and resource limits
        run: |
          generation=$(python3 -c "import json; print(json.load(open('runtime-result.json'))['collectorGeneration'])")
          python3 deployment/check-runtime-health.py --bucket sol-scan-511718-data --generation "$generation" --tries 48
